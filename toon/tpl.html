<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Baloo 2';font-weight:800;src:url(FONTDIR/baloo-2-devanagari-800-normal.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
@font-face{font-family:'Baloo 2';font-weight:800;src:url(FONTDIR/baloo-2-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Bangers;src:url(FONTDIR/bangers-latin-400-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff6e5;font-family:'Baloo 2',sans-serif}
#cam{position:absolute;inset:0;transform-origin:50% 55%}
svg{position:absolute;left:0;top:0}
#title{position:absolute;left:0;right:0;top:110px;text-align:center;font-weight:800;font-size:96px;line-height:1.05;color:#ffd84a;-webkit-text-stroke:9px #2b1d0e;paint-order:stroke fill;text-shadow:0 10px 0 #2b1d0e}
#title small{display:block;font-size:54px;color:#fff;-webkit-text-stroke:7px #2b1d0e}
#cap{position:absolute;left:40px;right:40px;top:1560px;text-align:center;font-weight:800;font-size:74px;line-height:1.18;color:#fff;-webkit-text-stroke:9px #1d1a24;paint-order:stroke fill;text-shadow:0 7px 0 #1d1a24}
#cap .w{display:inline-block;margin:0 8px}
#cap .on{color:#ffe14d}
#cap .w{padding:0 .06em;border-radius:.1em}
#who{position:absolute;left:0;right:0;top:1470px;text-align:center}
#who span{font-family:Bangers;font-size:58px;letter-spacing:3px;padding:4px 30px 0;border-radius:16px;border:6px solid #1d1a24;color:#1d1a24;box-shadow:6px 6px 0 #1d1a24}
.st{position:absolute;font-size:190px;line-height:1;filter:drop-shadow(8px 8px 0 rgba(0,0,0,.35))}
.haha{position:absolute;font-family:Bangers;font-size:120px;letter-spacing:4px;color:#ff4d6d;-webkit-text-stroke:7px #1d1a24;paint-order:stroke fill;text-shadow:7px 7px 0 #1d1a24}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#cta{position:absolute;left:0;right:0;top:170px;text-align:center}
#cta div{display:inline-block;white-space:nowrap;margin:8px;font-family:Bangers;font-size:70px;letter-spacing:3px;padding:10px 40px 0;border-radius:26px;border:8px solid #1d1a24;box-shadow:12px 12px 0 #1d1a24}
</style></head><body>
<div id="cam"><svg id="bg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg><svg id="chars" width="1080" height="1920" viewBox="0 0 1080 1920"></svg><svg id="fg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<div id="title"></div><div id="who"><span></span></div><div id="cap"></div><div id="stk"></div>
<div id="cta"><div style="background:#ffe14d">👋 KAL GOLU-BUNTY</div><div style="background:#ff9ed2">PHIR AAYENGE!</div><div style="background:#4ade80">👍 FOLLOW KARO 🔔</div></div>
<div id="flash"></div>
<script src="chars.js"></script><script src="scenes.js"></script>
<script>
const $ = (i) => document.getElementById(i);
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), ease = (x) => 1 - Math.pow(1 - cl(x), 3);
const back = (x) => { x = cl(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// ---------- backgrounds (original) ----------
const BG = {
  class: `<rect width="1080" height="1920" fill="#fdf1d6"/><rect y="1290" width="1080" height="630" fill="#c98f5a"/><rect y="1290" width="1080" height="16" fill="#a8703f"/>
    <g opacity=".25">${Array.from({ length: 9 }, (_, i) => `<rect x="${i * 130}" y="1306" width="4" height="614" fill="#7a4a22"/>`).join("")}</g>
    <rect x="210" y="390" width="660" height="420" rx="18" fill="#2f6b4f" stroke="#7a4a22" stroke-width="22"/>
    <text x="540" y="500" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="76" fill="#f5f5e8" opacity=".92">@@BOARD@@</text>
    <text x="540" y="585" text-anchor="middle" font-family="Bangers" font-size="54" fill="#f5f5e8" opacity=".7">2 + 2 = ?   ✏️</text>
    <rect x="330" y="805" width="420" height="16" rx="6" fill="#a8703f"/><rect x="400" y="796" width="60" height="12" rx="4" fill="#fff"/>
    <g><rect x="36" y="380" width="56" height="300" rx="8" fill="#e0544e"/><rect x="40" y="250" width="150" height="190" rx="10" fill="#8fd3ff" stroke="#fff" stroke-width="12"/><circle cx="150" cy="300" r="22" fill="#fff59d"/><ellipse cx="95" cy="350" rx="34" ry="14" fill="#fff"/><path d="M115,256 V434 M46,345 H184" stroke="#fff" stroke-width="8"/></g><circle cx="930" cy="330" r="70" fill="#fff" stroke="#7a4a22" stroke-width="10"/><path d="M930,330 L930,285 M930,330 L965,345" stroke="#1d1a24" stroke-width="8" stroke-linecap="round"/>
    <rect x="-40" y="1500" width="300" height="40" rx="10" fill="#8a5a2e"/><rect x="820" y="1500" width="300" height="40" rx="10" fill="#8a5a2e"/>`,
  home: `<rect width="1080" height="1920" fill="#ffe3cf"/><rect y="1290" width="1080" height="630" fill="#e8b27c"/>
    <g opacity=".18">${Array.from({ length: 12 }, (_, i) => `<rect x="0" y="${1310 + i * 52}" width="1080" height="4" fill="#7a4a22"/>`).join("")}</g>
    <rect x="80" y="420" width="260" height="320" rx="14" fill="#bfe3ff" stroke="#fff" stroke-width="16"/><path d="M210,420 V740 M80,580 H340" stroke="#fff" stroke-width="10"/>
    <rect x="640" y="430" width="300" height="220" rx="12" fill="#fff" stroke="#c07a3a" stroke-width="14"/><circle cx="740" cy="530" r="40" fill="#f2c08f"/><circle cx="840" cy="530" r="40" fill="#e9a97a"/>
    <path d="M60,1080 h960 a40,40 0 0 1 40,40 v170 h-1040 v-170 a40,40 0 0 1 40,-40z" fill="#c2445a"/><rect x="40" y="980" width="1000" height="140" rx="50" fill="#d9536b"/>
    <rect x="460" y="1180" width="160" height="22" rx="8" fill="#fff"/><path d="M500,1180 q-6,-40 20,-50 h40 q26,10 20,50" fill="#fff" stroke="#c07a3a" stroke-width="5"/>`,
  end: `<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff7ab6"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#eg)"/>
    ${Array.from({ length: 60 }, (_, i) => `<rect x="${(i * 173) % 1080}" y="${(i * 311) % 1300}" width="18" height="30" rx="4" fill="${["#ffe14d", "#4ade80", "#fff", "#60a5fa"][i % 4]}" transform="rotate(${i * 37} ${(i * 173) % 1080} ${(i * 311) % 1300})" opacity=".8"/>`).join("")}<rect y="1290" width="1080" height="630" fill="#5b3fd6" opacity=".55"/>`,
};
let D, curBg = "";
window.setup = (d) => { D = d; };
window.render = (t) => { if (window.KIN) KIN.grain(t, .1);
  const L = D.lines; let li = -1; for (let i = 0; i < L.length; i++) if (t >= L[i].t - 0.001) li = i;
  const l = li >= 0 ? L[li] : null, scene = l ? l.scene : L[0].scene;
  const SC = window.SCENES && SCENES[scene];
  if (SC) { if (SC.moving || scene !== curBg) { $("bg").innerHTML = SC.bg(t); $("fg").innerHTML = SC.fg(t); } }
  else if (scene !== curBg) { $("bg").innerHTML = (BG[scene] || BG.class).replace("@@BOARD@@", D.board || "आज टेस्ट है!"); $("fg").innerHTML = ""; }
  curBg = scene;
  // characters
  const speak = l && t < l.t + l.d ? l.who : null;
  const env = (x) => x.env[Math.min(x.env.length - 1, Math.floor((t - x.t) * 30))] || 0;
  const moodOf = (w) => { if (!l) return w === "G" ? "happy" : "grumpy"; return l.who === w ? l.mood : l.lmood; };
  const blinkOf = (w) => (Math.floor(t * 10 + (w === "G" ? 0 : 5)) % 41) === 0;
  const pos = { G: 290, B: 790 };
  let html = "";
  for (const w of ["G", "B"]) {
    const act = speak === w, m = act ? env(l) : 0, sc = act ? 1.0 + 0.03 * Math.abs(Math.sin(t * 8)) : 0.96;
    const hop = l && l.laugh && l.who !== w && t > l.t + l.d && t < l.t + l.d + 1 ? Math.abs(Math.sin((t - l.t - l.d) * 14)) * 18 : 0;
    const md = moodOf(w), dir = w === "G" ? 1 : -1;
    const laughNow = L.some((x) => x.laugh && x.who !== w && t > x.t + x.d && t < x.t + x.d + 1.3) || L.some((x) => x.laugh && x.who === w && t > x.t + x.d && t < x.t + x.d + 0.9 && w === "G");
    let pose = scene === "end" ? "wave" : act ? ({ angry: "point", shock: "shock", laugh: "laugh", smug: "shrug", confused: "shrug" }[md] || "talk")
      : ({ laugh: "laugh", shock: "shock", angry: "cross", grumpy: w === "B" ? "cross" : "idle", smug: w === "B" ? "cross" : "idle", confused: "idle" }[md] || "idle");
    if (laughNow && scene !== "end") pose = "laugh";
    html += `<g transform="translate(${pos[w]},${1470 - hop}) scale(${sc * 1.28})">${TOON.draw(w, { m, mood: pose === "laugh" && !act ? "laugh" : md, blink: blinkOf(w), wave: scene === "end" ? 1 : 0, pose, dir, t })}</g>`;
  }
  $("chars").innerHTML = html;
  // camera: gentle push toward the speaker; punchline = close-up on speaker, then a reaction cut to the listener
  let z = 1, cx = 540, cy = 1000, sx = 0, sy = 0, fl = 0;
  if (speak && scene !== "end") { const k = ease((t - l.t) / 0.6); z = 1 + 0.06 * k; cx = 540 + (pos[speak] - 540) * 0.6 * k; }
  for (const x of L) {
    const other = x.who === "G" ? "B" : "G";
    if (x.laugh && x.scene !== "end") {
      const a = x.t + x.d * 0.55, b = x.t + x.d + 0.15, c = b + 1.0;
      if (t >= a && t < b) { z = 1.34 + 0.02 * (t - a); cx = pos[x.who]; cy = 820; if (t - a < 0.12) fl = Math.max(fl, 0.35 * (1 - (t - a) / 0.12)); }
      else if (t >= b && t < c) { z = 1.34; cx = pos[other]; cy = 820; if (t - b < 0.12) fl = Math.max(fl, 0.35 * (1 - (t - b) / 0.12)); }
    }
    if (x.sfx === "rimshot") { const q = t - (x.t + x.d); if (q > 0 && q < 0.5) { sx = Math.sin(t * 90) * 14 * (1 - q / 0.5); sy = Math.cos(t * 70) * 10 * (1 - q / 0.5); } }
    const sct = x.t - 0.05; if (L.indexOf(x) > 0 && L[L.indexOf(x) - 1].scene !== x.scene && t > sct && t < sct + 0.18) fl = 0.8 * (1 - (t - sct) / 0.18);
  }
  $("cam").style.transformOrigin = `${cx}px ${cy}px`; $("cam").style.transform = `translate(${sx}px,${sy}px) scale(${z})`;
  $("flash").style.opacity = fl;
  // title hook
  const tt = t; $("title").innerHTML = D.title + "<small>GOLU vs BUNTY</small>";
  $("title").style.opacity = tt < D.hook + 1.2 ? 1 - cl((tt - D.hook - 0.7) / 0.5) : 0; $("title").style.transform = `scale(${0.3 + 0.7 * back(tt / 0.45)})`;
  // captions
  const end = D.total - 1.8;
  if (l && t < Math.min(l.t + l.d + 0.35, end + 0.2)) {
    const words = l.text.split(" "), p = (t - l.t) / l.d, on = Math.min(words.length - 1, Math.floor(p * words.length));
    const k = li + ":" + on; if ($("cap").dataset.k !== k) { $("cap").innerHTML = words.map((x, i) => `<span class="w${i === on && p < 1 ? " on" : ""}">${x}</span>`).join(" "); $("cap").dataset.k = k; }
    if (window.KIN) { const tot = words.reduce((a, w) => a + w.length + 1, 0); let acc = 0; [...$("cap").children].forEach((sp, i) => { const a = l.t + l.d * acc / tot; acc += words[i].length + 1; KIN.word(sp, t, a, l.t + l.d * acc / tot, { on: l.who === "G" ? "rgba(255,138,31,.9)" : "rgba(109,74,255,.85)" }); }); }
    $("cap").style.opacity = 1; $("cap").style.transform = window.KIN ? "" : `scale(${0.85 + 0.15 * back((t - l.t) / 0.25)})`;
    const s = $("who").firstElementChild; s.textContent = l.who === "G" ? "GOLU 😊" : "BUNTY 😒"; s.style.background = l.who === "G" ? "#ffd84a" : "#ff8a65"; $("who").style.opacity = 1;
  } else { $("cap").style.opacity = 0; $("who").style.opacity = 0; }
  // stickers + HAHA
  let st = "";
  for (const x of L) {
    const k = t - (x.t + x.d * 0.8); if (k < 0 || k > 1.7) continue;
    const a = back(k / 0.3), o = k > 1.4 ? 1 - (k - 1.4) / 0.3 : 1;
    if (x.emoji) st += `<div class="st" style="left:${x.who === "G" ? 700 : 110}px;top:300px;opacity:${o};transform:scale(${a}) rotate(${Math.sin(k * 10) * 8}deg)">${x.emoji}</div>`;
    if (x.laugh) st += `<div class="haha" style="left:${x.laugh > 1 ? 250 : 330}px;top:${1000 - k * 40}px;opacity:${o};transform:scale(${a * (x.laugh > 1 ? 1.3 : 1)}) rotate(-8deg)">HA HA HA!</div>`;
  }
  $("stk").innerHTML = st;
  const es = (L.find((x) => x.scene === "end") || { t: end }).t;   // end card from the first outro line till the last frame
  const ok = t - es; $("cta").style.opacity = ok > 0 ? 1 : 0;
  $("cta").style.transform = `scale(${ok > 0 ? back(ok / 0.4) * (1 + 0.04 * Math.sin(t * 7)) : 0})`;
  [...$("cta").children].forEach((c, i) => { const k = back((ok - i * 0.25) / 0.35); c.style.transform = `scale(${Math.max(0, k)}) rotate(${(i % 2 ? 3 : -3) + Math.sin(t * 5 + i) * 2}deg)`; });
};
</script></body></html>
