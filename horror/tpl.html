<div id="end" style="opacity:0"><h1>THE END?</h1><p>Part 2 chahiye? 👇</p><small>Comment mein likho "PART 2"</small><small>Follow karo 🔔</small></div>
<script>
let D=null;const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, lerp=(a,b,k)=>a+(b-a)*k;
const nz=t=>Math.sin(t*12.9898)*0.5+Math.sin(t*78.233)*0.3+Math.sin(t*37.719)*0.2; // pseudo noise
window.setup=d=>{D=d;};
function seg(i){return D.segs[i]||{start:0,end:0};}
function sceneAt(t){let s=1;D.segs.forEach(g=>{if(t>=g.start-0.01)s=g.scene;});return s;}
function sceneStart(n){const g=D.segs.find(x=>x.scene===n);return g?g.start:0;}
// camera shots: [cx,cy,scale] (world point at screen centre)
function shot(cx,cy,s){return {cx,cy,s};}
function mix(a,b,k){return {cx:lerp(a.cx,b.cx,k),cy:lerp(a.cy,b.cy,k),s:lerp(a.s,b.s,k)};}
const WIDE=shot(540,1060,1.0), CLOCK=shot(145,1135,3.4), FACE=shot(420,900,2.3), HANDS=shot(330,930,2.6), DOOR=shot(860,1060,1.55), GAP=shot(860,1520,3.0), MED=shot(450,1000,1.6);
function camera(t){
  const s1=sceneStart(1),s2=sceneStart(2),s3=sceneStart(3),s4=sceneStart(4),s5=sceneStart(5),s6=sceneStart(6);
  const k3=D.segs.find(g=>g.sfx_after==='knock'), knockT=k3?k3.end+0.15:s3+3;
  if(t<1.4) return mix(CLOCK,shot(145,1135,3.0),t/1.4);
  if(t<s2) return mix(shot(500,1100,1.05),shot(470,1020,1.35),ease((t-1.4)/(s2-1.4)));
  if(t<s3) return mix(shot(440,960,1.6),FACE,ease((t-s2)/1.2));
  if(t<knockT-0.1) return mix(HANDS,shot(320,920,2.9),(t-s3)/(knockT-s3));
  if(t<s4) return mix(DOOR,shot(860,1000,1.9),ease((t-knockT)/(s4-knockT)));
  if(t<s5) return mix(shot(420,890,2.6),shot(420,880,2.9),(t-s4)/(s5-s4));
  if(t<s6) return mix(GAP,shot(860,1500,3.6),ease((t-s5)/(s6-s5)));
  const last=D.segs[D.segs.length-1];
  if(t<last.start) return mix(MED,shot(420,920,2.2),ease((t-s6)/(last.start-s6)));
  return mix(shot(380,960,2.0),shot(370,960,2.6),ease((t-last.start)/(last.end-last.start)));
}
function mouthPath(type,k){ // around (420,960)
  if(type==='o') return `M405 958 Q420 ${948-6*k} 435 958 Q420 ${972+8*k} 405 958 Z`;
  if(type==='scream') return `M392 950 Q420 ${935-6*k} 448 950 Q445 ${995+12*k} 420 ${1000+12*k} Q395 ${995+12*k} 392 950 Z`;
  if(type==='talk') return `M402 958 Q420 952 438 958 Q420 ${966+10*Math.abs(k)} 402 958 Z`;
  return 'M400 960 Q420 956 440 960';
}
window.render=function(t){
  const d=D, sc=sceneAt(t), last=d.segs[d.segs.length-1];
  const handT=last.start+(last.end-last.start)*0.62, stingT=last.end+0.05, endT=stingT+0.9;
  // camera + shake
  let c=camera(t); let shake=0;
  d.knocks.forEach(k=>{const q=t-k; if(q>0&&q<0.25) shake=Math.max(shake,18*(1-q/0.25));});
  if(t>stingT&&t<stingT+0.6) shake=Math.max(shake,30*(1-(t-stingT)/0.6));
  if(sc===3&&t<(d.knocks[0]||0)) shake=Math.max(shake,4); // trembling hands
  if(sc===4) shake=Math.max(shake,3);
  const sx=shake*nz(t*3), sy=shake*nz(t*3+5);
  $('cam').style.transform=`translate(${540-c.cx*c.s+sx}px,${960-c.cy*c.s+sy}px) scale(${c.s})`;
  // environment
  $('curtain').setAttribute('d',`M50 285 C ${110+18*Math.sin(t*1.3)} 400, ${70+14*Math.sin(t*1.7)} 560, ${120+20*Math.sin(t*1.1)} 760 L 40 760 L 40 285 Z`);
  const flick=sc>=5?0.55+0.45*(nz(t*2)>-.2?1:0.2):1;
  $('beamPoly').style.opacity=0.8*flick;
  $('clockGlow').style.opacity=0.6+0.4*Math.abs(Math.sin(t*3));
  $('clockTxt').style.opacity=(Math.floor(t*2)%2===0||t<1.4)?1:0.75;
  // phone: on bed (ringing) until pick-up in scene 2
  const s2=sceneStart(2), pick=ease((t-s2)/0.9);
  const ring=t<s2?(Math.sin(t*40)*(Math.floor(t*1.6)%2===0?1:0)):0;
  const px=lerp(565,318,pick)+ring*4, py=lerp(1305,890,pick), rot=lerp(-80,-10,pick)+ring*6;
  $('phone').setAttribute('transform',`translate(${px} ${py}) rotate(${rot})`);
  $('scr').setAttribute('fill', t<s2? (Math.floor(t*2)%2? '#9fd0ff':'#5d9cff') : '#5d9cff');
  $('pglow').setAttribute('cx',px); $('pglow').setAttribute('cy',py); $('pglow').setAttribute('r', t<s2? 230+40*Math.abs(Math.sin(t*6)) : 300);
  $('pglow').style.opacity=t<1.2?0:Math.min(1,(t-1.2)/0.4)*(sc>=5?0.75+0.25*flick:1);
  // arm to phone
  $('armL').setAttribute('d', pick<=0? 'M330 1060 Q 290 1180 320 1300' : `M330 1060 Q ${lerp(290,250,pick)} ${lerp(1180,1000,pick)} ${px+8} ${py+30}`);
  // rohan backs away in scene 6
  const back=sc===6?ease((t-sceneStart(6))/1.5)*-60:0;
  $('rohan').setAttribute('transform',`translate(${back} 0)`);
  // door knocks
  let dk=0; d.knocks.forEach(k=>{const q=t-k; if(q>0&&q<0.18) dk=Math.max(dk,1-q/0.18);});
  $('doorLeaf').setAttribute('transform',`translate(${dk*6} ${dk*-3})`);
  // feet shadow under door (scene 5+)
  const fk=ease((t-sceneStart(5))/2.2); $('feet').style.opacity=sc>=5?fk:0;
  $('feet').setAttribute('transform',`translate(${(1-fk)*-140+6*Math.sin(t*1.5)} 0)`);
  $('gap').style.opacity=sc>=5?0.7+0.3*flick:0.55;
  // expressions
  let eye=1, pupil=10, brow=0, mouth='closed', mk=0, sweat=0, tear=0, lid=0;
  if(sc===1){ eye=t<s2-1.5?0.55:0.9; lid=t<s2-1.5?7:0; }
  if(sc===2){ eye=1.25; pupil=8; brow=8; mouth='o'; mk=.4; }
  if(sc===3){ eye=1.35; pupil=7; brow=12; mouth='o'; mk=.6; sweat=1; }
  if(sc===4){ eye=1.45; pupil=6; brow=16; mouth='scream'; mk=0.6+0.4*Math.abs(Math.sin(t*9)); sweat=1; tear=1; }
  if(sc===5){ eye=1.5; pupil=5; brow=14; mouth='o'; mk=.8; sweat=1; tear=1; }
  if(sc===6){ eye=t>handT-0.4?1.9:1.55; pupil=t>handT-0.4?3.5:5; brow=18; mouth=t>handT?'scream':'o'; mk=1; sweat=1; tear=1; }
  // talk when Rohan speaks
  d.segs.forEach(g=>{ if(g.who==='ROHAN'&&t>=g.start&&t<g.end){ mouth='scream'; mk=0.5+0.5*Math.abs(Math.sin(t*14)); }});
  const blink=(sc<=2&&(t%3.7)<0.12)?1:0;
  ['L','R'].forEach((s,i)=>{ $('eyeW'+s).setAttribute('ry',16*eye*(1-blink*0.9)); $('pup'+s).setAttribute('r',pupil);
    const jitter=sc>=3?1.5*nz(t*20+i):0; $('pup'+s).setAttribute('cx',(i?465:375)+jitter+(sc===6&&t>handT-0.4?(i?-6:-6):0)); $('lid'+s).setAttribute('height',lid); });
  $('browL').setAttribute('d',`M350 ${842-brow*0.4} L 400 ${836-brow}`); $('browR').setAttribute('d',`M440 ${836-brow} L 490 ${842-brow*0.4}`);
  $('mouth').setAttribute('d',mouthPath(mouth,mk));
  $('sweat').style.opacity=sweat*(0.6+0.4*Math.sin(t*2)); $('sweat').setAttribute('transform',`translate(0 ${sweat?((t*25)%60):0})`);
  $('tear').style.opacity=tear*0.85; $('tear').setAttribute('transform',`translate(0 ${tear?((t*18)%50):0})`);
  // ghost hand
  const hk=ease((t-handT)/0.9); $('ghand').style.opacity=t>handT?Math.min(1,hk*1.4):0;
  $('ghand').setAttribute('transform',`translate(${(1-hk)*-120+back} ${(1-hk)*-160})`);
  // darkness / flicker
  $('dark').style.opacity=t<1.2?0.55:(sc>=5?0.32+0.25*(1-flick):0.22);
  // grain seed
  $('turb').setAttribute('seed',Math.floor(t*24)%97);
  // subtitles
  const g=d.segs.find(x=>t>=x.start-0.05&&t<x.end+0.25); const sub=$('sub');
  const txt=g&&t<stingT?g.sub:''; if(sub._t!==txt){sub._t=txt; sub.innerHTML=txt.startsWith('"')?'<b>'+txt.replace(/"/g,'')+'</b>':txt;}
  sub.style.opacity=g?cl((t-g.start+0.05)/0.15):0;
  // black open + flash + end
  $('black').style.opacity=t<0.25?1-t/0.25:(t>stingT+0.12?1:0);
  $('flash').style.opacity=t>stingT&&t<stingT+0.12?0.9:(t>handT&&t<handT+0.08?0.35:0);
