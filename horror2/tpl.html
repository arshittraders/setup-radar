<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0}
#sub{position:absolute;left:60px;right:60px;top:1420px;text-align:center;font-family:Mukta,'Noto Sans Devanagari',sans-serif;font-weight:800;font-size:72px;line-height:1.28;color:#fff;
  text-shadow:0 0 6px #000,0 0 14px #000,3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
#sub b{color:#ffd23f;font-weight:800}
#title{position:absolute;left:50px;right:50px;top:620px;text-align:center;font-family:Mukta,'Noto Sans Devanagari',sans-serif;font-weight:800;font-size:92px;line-height:1.2;color:#fff;text-shadow:0 0 30px rgba(255,0,0,.8),4px 4px 0 #000}
#title small{display:block;font-size:46px;color:#ff4d4d;margin-top:30px;letter-spacing:4px}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-family:Mukta,'Noto Sans Devanagari',sans-serif;background:rgba(0,0,0,.82);padding:0 70px}
#end h1{font-size:88px;color:#ff2b2b;text-shadow:0 0 30px rgba(255,0,0,.7);line-height:1.2}
#end p{font-size:62px;font-weight:800;margin-top:50px;line-height:1.3}
#end small{font-size:46px;font-weight:800;margin-top:60px;padding:22px 50px;background:#d10f1b;border-radius:24px}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.92) 100%)}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="vig"></div>
<div id="title"></div>
<div id="sub"></div>
<div id="end"><h1></h1><p></p><small></small></div>
<div id="flash"></div><div id="black"></div>
<script src="scenes.js"></script>
<script>
const $ = (id) => document.getElementById(id), C = $('c'), X = C.getContext('2d');
const cl = (x) => Math.max(0, Math.min(1, x)), ease = (x) => 1 - Math.pow(1 - cl(x), 3);
const nz = (t) => Math.sin(t * 1.3) * 0.5 + Math.sin(t * 3.7 + 1) * 0.3 + Math.sin(t * 7.1 + 2) * 0.2;
let D;
window.setup = (d) => { D = d; $('title').innerHTML = d.title + '<small>⚠️ अकेले मत देखना</small>';
  document.querySelector('#end h1').textContent = '😱 ' + (d.endWord || 'क्या आप डरे?');
  document.querySelector('#end p').textContent = d.question || 'आप होते तो क्या करते? 👇';
  document.querySelector('#end small').textContent = '🔔 FOLLOW ' + (d.brand || '');
  // scene blocks: consecutive lines on the same scene index form one shot
  D.shots = []; d.segs.forEach((g) => { const L = D.shots[D.shots.length - 1]; if (L && L.scene === g.scene) L.end = g.end; else D.shots.push({ scene: g.scene, start: D.shots.length ? g.start - (g.pre || 0.3) : 0, end: g.end }); });
  D.shots.forEach((s, i) => { s.cam = [[0.5, 0.45], [0.42, 0.55], [0.6, 0.5], [0.5, 0.62]][i % 4]; s.zoom = i % 2 ? [1.18, 1.04] : [1.02, 1.16]; });
};
window.render = (t) => {
  const last = D.segs[D.segs.length - 1], sting = last.end + 0.05, endT = sting + 0.85;
  let si = D.shots.findIndex((s) => t < s.end + 0.0001); if (si < 0) si = D.shots.length - 1; const sh = D.shots[si];
  const k = cl((t - sh.start) / Math.max(0.5, sh.end - sh.start)), key = D.scenes[sh.scene] || 'road';
  // light flicker: soft noise + hard drops on "flicker" lines and in the last third
  const g = D.segs.find((x) => t >= x.start && t < x.end + 0.2);
  const late = t > D.segs[Math.floor(D.segs.length * 0.66)].start;
  let fl = 0.85 + 0.15 * nz(t * 2); if ((g && g.fx === 'flicker') || late) fl = nz(t * 5) > -0.1 ? 1 : 0.15;
  // spirit visibility: hints while G speaks, full in the final shot
  let gh = 0; if (g && g.who === 'G') gh = 0.65; if (si === D.shots.length - 1) gh = Math.max(gh, ease((t - sh.start) / 2.5)); if (late) gh = Math.max(gh, 0.25 + 0.2 * Math.sin(t * 2));
  // shake: knocks + final scream
  let shk = 0; (D.knocks || []).forEach((q) => { const d = t - q; if (d > 0 && d < 0.25) shk = Math.max(shk, 16 * (1 - d / 0.25)); }); if (t > sting && t < sting + 0.7) shk = 30;
  const z = sh.zoom[0] + (sh.zoom[1] - sh.zoom[0]) * ease(k), cx = sh.cam[0] * 1080, cy = sh.cam[1] * 1920;
  X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, 1080, 1920);
  if (t > sting && t < endT) { window.HSCARE(X, cl((t - sting) / 0.85), t); }
  else { const tx = Math.min(0, Math.max(1080 - 1080 * z, 540 - cx * z)), ty = Math.min(0, Math.max(1920 - 1920 * z, 960 - cy * z)); X.setTransform(z, 0, 0, z, tx + shk * nz(t * 9), ty + shk * nz(t * 9 + 3));
    window.HSCENES[key](X, t, { k, flick: fl, ghost: gh }); X.setTransform(1, 0, 0, 1, 0, 0);
    X.fillStyle = `rgba(0,0,0,${0.18 + 0.4 * (1 - fl) * 0.5})`; X.fillRect(0, 0, 1080, 1920);
    // grain
    X.fillStyle = 'rgba(255,255,255,.035)'; for (let i = 0; i < 260; i++) { const r = Math.sin((i + Math.floor(t * 24) * 53) * 12.9898) * 43758.5453; const x = (r - Math.floor(r)) * 1080, y = ((r * 7.13) % 1) * 1920; X.fillRect(x, Math.abs(y), 3, 3); } }
  // shot change: quick dip to black
  const prev = D.shots[si].start; const dip = si > 0 ? Math.max(0, 1 - Math.abs(t - prev) / 0.22) : 0;
  $('black').style.opacity = t < 0.3 ? 1 - t / 0.3 : (t > endT - 0.05 && t < endT + 0.25 ? 1 - (t - endT + 0.05) / 0.3 : dip * 0.9);
  $('flash').style.opacity = t > sting && t < sting + 0.1 ? 0.95 : (t > sting + 0.35 && t < sting + 0.42 ? 0.5 : 0);
  // title card
  const tk = t < D.segs[0].start ? 1 : 1 - cl((t - D.segs[0].start) / 0.4); $('title').style.opacity = tk; $('title').style.transform = `scale(${1.08 - 0.08 * ease(t / 0.8)})`;
  // subtitles (karaoke)
  const sub = $('sub'); if (t < sting && window.karaoke && g && g.words) window.karaoke(sub, D.segs, t, { max: 4, on: g.who === 'G' ? '#ff5a5a' : '#ffd23f', mark: 'rgba(150,0,10,.85)' });
  else { if (sub._t !== '') { sub._t = ''; sub._k = null; sub.innerHTML = ''; } }
  sub.style.opacity = t < sting ? 1 : 0;
  const ek = cl((t - endT) / 0.5); $('end').style.opacity = ek; $('end').style.transform = `scale(${1.12 - 0.12 * ek})`;
};
</script></body></html>
