      rx = C.rot[i][0] * w; ry = C.rot[i][1] * w; rz = C.rot[i][2] * w; if (u >= .5) fallen++; }
    Q.setFromEuler(E.set(rx, ry, rz)); M4.compose(V.set(x, y + onion.position.y * 0, z), Q, Sv.set(sc, sc, sc)); cubes.setMatrixAt(i, M4); }
  cubes.instanceMatrix.needsUpdate = true; cubes.visible = t >= r.tCol;
  const realF = Math.round(r.real * fallen / C.P.length); const cb = document.getElementById('cubes'); cb.textContent = (r.real > 100000 && realF > 0 ? '≈' : '') + fmt(r.real > 100000 ? Math.round(realF / 1000) * 1000 : realF);
  renderer.render(scene, cam);
};
