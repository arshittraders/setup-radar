  G.uniform1i(U('mode'), S.mode); G.uniform1i(U('pal'), S.pal); G.uniform1f(U('tw'), S.tw); G.uniform1f(U('sp'), S.sp); G.uniform1f(U('cn'), S.cn); G.uniform1f(U('ph'), S.ph); G.uniform1f(U('sat'), S.sat); };
