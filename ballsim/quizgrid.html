<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script src="common.js"></script><script>
// FOCUS TEST grid — "Which ___ never ___?": every item changes once at a random moment except one. Viewers comment letter+number, then reveal.
window.DUR = [16, 24];
const ITEMS = {
  domino: { q: ['Which domino', 'never falls?'], d(x, y, s, k, v) { X.save(); X.translate(x - 30 * s, y + 34 * s); X.rotate(-(v.lean + (1.5708 - v.lean) * k)); X.fillStyle = '#f5f5f5'; X.beginPath(); X.roundRect(0, -68 * s, 30 * s, 68 * s, 5 * s); X.fill(); X.fillStyle = '#222'; X.fillRect(0, -35 * s, 30 * s, 2.5 * s); for (const yy of [-52, -18]) { X.beginPath(); X.arc(15 * s, yy * s, 3.5 * s, 0, 7); X.fill(); } X.restore(); X.strokeStyle = 'rgba(255,255,255,.35)'; X.lineWidth = 2; X.beginPath(); X.moveTo(x - 45 * s, y + 35 * s); X.lineTo(x + 45 * s, y + 35 * s); X.stroke(); } },
  switch: { q: ['Which switch', 'never turns on?'], d(x, y, s, k, v, C) { X.fillStyle = k > 0.5 ? C : 'rgba(255,255,255,.18)'; X.beginPath(); X.roundRect(x - 40 * s, y - 20 * s, 80 * s, 40 * s, 20 * s); X.fill(); X.fillStyle = '#fff'; X.beginPath(); X.arc(x - 20 * s + 40 * s * k, y, 15 * s, 0, 7); X.fill(); } },
  moon: { q: ['Which moon', 'never gets full?'], d(x, y, s, k, v) { const r = 30 * s; X.fillStyle = '#fff5c8'; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); const p = v.ph * (1 - k); if (p > 0.01) { X.fillStyle = '#17151f'; X.beginPath(); X.arc(x + r * (2 - 2 * p) * (v.side ? 1 : -1) * 0.5 + (v.side ? r * p : -r * p) * 0, y, r, 0, 7); X.save(); X.beginPath(); X.arc(x, y, r + 1, 0, 7); X.clip(); X.fillStyle = '#17151f'; X.beginPath(); X.arc(x + (v.side ? 1 : -1) * r * 2 * (1 - p), y, r * 1.05, 0, 7); X.fill(); X.restore(); } X.strokeStyle = 'rgba(255,255,255,.25)'; X.lineWidth = 2; X.beginPath(); X.arc(x, y, r, 0, 7); X.stroke(); } },
  check: { q: ['Which box', 'never gets ticked?'], d(x, y, s, k, v, C) { X.strokeStyle = 'rgba(255,255,255,.7)'; X.lineWidth = 3 * s; X.beginPath(); X.roundRect(x - 28 * s, y - 28 * s, 56 * s, 56 * s, 9 * s); X.stroke(); if (k > 0) { X.strokeStyle = C; X.lineWidth = 7 * s; X.lineCap = 'round'; X.beginPath(); X.moveTo(x - 15 * s, y); const m = Math.min(1, k * 2); X.lineTo(x - 15 * s + 11 * s * m, y + 13 * s * m); if (k > 0.5) { const n = (k - 0.5) * 2; X.lineTo(x - 4 * s + 22 * s * n, y + 13 * s - 30 * s * n); } X.stroke(); } } },
  bulb: { q: ['Which bulb', 'never lights up?'], d(x, y, s, k, v, C) { if (k > 0) { X.fillStyle = `rgba(255,220,90,${0.35 * k})`; X.beginPath(); X.arc(x, y - 8 * s, 46 * s, 0, 7); X.fill(); } X.fillStyle = k > 0.5 ? '#ffe066' : 'rgba(255,255,255,.22)'; X.beginPath(); X.arc(x, y - 8 * s, 24 * s, 0, 7); X.fill(); X.fillStyle = '#9aa0ad'; X.fillRect(x - 11 * s, y + 14 * s, 22 * s, 16 * s); } },
  bubble: { q: ['Which bubble', 'never pops?'], d(x, y, s, k, v) { if (k < 1) { const r = (v.r * s) * (1 + 0.3 * k); X.globalAlpha = 1 - k; X.strokeStyle = '#bfe9ff'; X.lineWidth = 3; X.beginPath(); X.arc(x, y, r, 0, 7); X.stroke(); X.fillStyle = 'rgba(191,233,255,.12)'; X.fill(); X.globalAlpha = 1; } if (k > 0 && k < 1) for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283, d = (v.r + 24 * k) * s; X.fillStyle = `rgba(191,233,255,${1 - k})`; X.beginPath(); X.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 3 * s, 0, 7); X.fill(); } } },
  rocket: { q: ['Which rocket', 'never takes off?'], d(x, y, s, k, v) { X.strokeStyle = 'rgba(255,255,255,.4)'; X.lineWidth = 2; X.strokeRect(x - 34 * s, y - 34 * s, 68 * s, 68 * s); const yy = y + 10 * s - 120 * s * k * k; if (k < 0.95) { X.save(); X.beginPath(); X.rect(x - 34 * s, y - 34 * s, 68 * s, 68 * s); X.clip(); X.fillStyle = '#fff'; X.beginPath(); X.moveTo(x, yy - 24 * s); X.lineTo(x + 10 * s, yy + 6 * s); X.lineTo(x - 10 * s, yy + 6 * s); X.fill(); X.fillStyle = '#ff7a45'; if (k > 0) { X.beginPath(); X.moveTo(x - 6 * s, yy + 8 * s); X.lineTo(x + 6 * s, yy + 8 * s); X.lineTo(x, yy + 24 * s); X.fill(); } X.restore(); } } },
  candle: { q: ['Which candle', 'never gets lit?'], d(x, y, s, k, v) { X.fillStyle = '#f3e6d0'; X.fillRect(x - 12 * s, y - 10 * s, 24 * s, 44 * s); X.strokeStyle = '#333'; X.lineWidth = 2; X.beginPath(); X.moveTo(x, y - 10 * s); X.lineTo(x, y - 18 * s); X.stroke(); if (k > 0) { const f = 1 + 0.15 * Math.sin(S.t * 30 + v.r); X.fillStyle = `rgba(255,170,40,${k})`; X.beginPath(); X.ellipse(x, y - 30 * s, 8 * s * f, 16 * s * f, 0, 0, 7); X.fill(); X.fillStyle = `rgba(255,240,150,${k})`; X.beginPath(); X.ellipse(x, y - 27 * s, 4 * s, 8 * s, 0, 0, 7); X.fill(); } } },
  heart: { q: ['Which heart', 'never fills up?'], d(x, y, s, k, v, C) { const hp = () => { X.beginPath(); for (let i = 0; i <= 30; i++) { const t = i / 30 * 6.283, px = 16 * Math.pow(Math.sin(t), 3), py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); i ? X.lineTo(x + px * 2 * s, y + py * 2 * s) : X.moveTo(x + px * 2 * s, y + py * 2 * s); } X.closePath(); }; hp(); X.strokeStyle = 'rgba(255,255,255,.7)'; X.lineWidth = 3; X.stroke(); if (k > 0) { X.save(); hp(); X.clip(); X.fillStyle = C; X.fillRect(x - 40 * s, y + 36 * s - 76 * s * k, 80 * s, 76 * s * k); X.restore(); } } },
  timer: { q: ['Which timer', 'never runs out?'], d(x, y, s, k, v) { const r = 28 * s, left = v.ph * (1 - k); X.strokeStyle = 'rgba(255,255,255,.6)'; X.lineWidth = 3; X.beginPath(); X.arc(x, y, r, 0, 7); X.stroke(); if (left > 0.01) { X.fillStyle = '#fff'; X.beginPath(); X.moveTo(x, y); X.arc(x, y, r - 4, -1.5708, -1.5708 + left * 6.283); X.closePath(); X.fill(); } } },
  egg: { q: ['Which egg', 'never hatches?'], d(x, y, s, k, v) { X.fillStyle = '#fff4dc'; if (k < 0.6) { X.beginPath(); X.ellipse(x, y, 24 * s, 32 * s, 0, 0, 7); X.fill(); if (k > 0) { X.strokeStyle = '#6b5a40'; X.lineWidth = 2; X.beginPath(); X.moveTo(x - 18 * s, y - 4 * s); X.lineTo(x - 6 * s, y + 4 * s); X.lineTo(x + 4 * s, y - 6 * s); X.lineTo(x + 18 * s, y + 2 * s); X.stroke(); } } else { X.beginPath(); X.ellipse(x, y + 12 * s, 24 * s, 20 * s, 0, 0, 3.1416); X.fill(); X.fillStyle = '#ffd23f'; X.beginPath(); X.arc(x, y - 6 * s, 16 * s, 0, 7); X.fill(); X.fillStyle = '#222'; X.beginPath(); X.arc(x - 5 * s, y - 9 * s, 2.5 * s, 0, 7); X.arc(x + 5 * s, y - 9 * s, 2.5 * s, 0, 7); X.fill(); X.fillStyle = '#ff8a3d'; X.beginPath(); X.moveTo(x - 4 * s, y - 3 * s); X.lineTo(x + 4 * s, y - 3 * s); X.lineTo(x, y + 2 * s); X.fill(); } } },
  battery: { q: ['Which battery', 'never charges?'], d(x, y, s, k, v, C) { X.strokeStyle = 'rgba(255,255,255,.7)'; X.lineWidth = 3; X.strokeRect(x - 30 * s, y - 16 * s, 56 * s, 32 * s); X.fillStyle = 'rgba(255,255,255,.7)'; X.fillRect(x + 26 * s, y - 7 * s, 6 * s, 14 * s); const lv = v.ph * 0.35 + (1 - v.ph * 0.35) * k; X.fillStyle = k >= 1 ? '#5dff8f' : lv < 0.3 ? '#ff4d6d' : C; X.fillRect(x - 27 * s, y - 13 * s, 50 * s * lv, 26 * s); } },
  pinwheel: { diff: 1, q: ['Which pinwheel', 'spins slower?'], d(x, y, s, k, v, C, odd) { const a = S.t * (odd ? 2.2 : 3.4) + v.ph * 6; X.save(); X.translate(x, y); X.rotate(a); for (let i = 0; i < 4; i++) { X.rotate(1.5708); X.fillStyle = ['#ff4d6d', '#ffd23f', '#4dabff', '#5dff8f'][i]; X.beginPath(); X.moveTo(0, 0); X.lineTo(26 * s, -6 * s); X.lineTo(26 * s, 14 * s); X.closePath(); X.fill(); } X.restore(); X.fillStyle = '#fff'; X.beginPath(); X.arc(x, y, 4 * s, 0, 7); X.fill(); } },
  face: { diff: 1, q: ['Which face', 'blinks twice?'], d(x, y, s, k, v, C, odd) { const per = 2.4, ph = (S.t + v.ph * per) % per, bl = ph < 0.12 || (odd && ph > 0.25 && ph < 0.37); X.fillStyle = '#ffd98a'; X.beginPath(); X.arc(x, y, 28 * s, 0, 7); X.fill(); X.fillStyle = '#3a2a1a'; for (const ex of [-9, 9]) { if (bl) X.fillRect(x + ex * s - 5 * s, y - 6 * s, 10 * s, 2.5 * s); else { X.beginPath(); X.arc(x + ex * s, y - 5 * s, 3.5 * s, 0, 7); X.fill(); } } X.strokeStyle = '#3a2a1a'; X.lineWidth = 2.5 * s; X.beginPath(); X.arc(x, y + 3 * s, 10 * s, 0.3, 2.84); X.stroke(); } },
  pulse: { diff: 1, q: ['Which dot', 'beats off-rhythm?'], d(x, y, s, k, v, C, odd) { const b = Math.pow(Math.max(0, Math.sin((S.t + (odd ? 0.37 : 0)) * 3.1416 * 1.6)), 8); X.fillStyle = C; X.globalAlpha = 0.35 + 0.65 * b; X.beginPath(); X.arc(x, y, (14 + 10 * b) * s, 0, 7); X.fill(); X.globalAlpha = 1; } },
  lamp: { diff: 1, q: ['Which lamp', 'changes colour backwards?'], d(x, y, s, k, v, C, odd) { const seq = ['#5dff8f', '#ffb347', '#c77dff'], i = Math.floor((S.t * 1.25 + v.r % 3) ) % 3, col = seq[odd ? (3 - i) % 3 : i]; X.fillStyle = col; X.save(); X.translate(x, y); X.rotate(0.785); X.fillRect(-15 * s, -15 * s, 30 * s, 30 * s); X.restore(); } },
};
const PAL = [['#ff4d6d', '#16121c', '#211a2b'], ['#4dabff', '#0d1420', '#132033'], ['#5dff8f', '#0d1712', '#13241b'], ['#ffd23f', '#18150c', '#262012'], ['#c77dff', '#140f1c', '#20172d'], ['#2ee6d6', '#0b1718', '#122426']];
window.init = (cfg) => { rnd = mulberry(cfg.seed || 7); const keys = Object.keys(ITEMS), kind = keys[Math.floor(rnd() * keys.length)], pal = PAL[Math.floor(rnd() * PAL.length)];
  const cols = 5 + (rnd() < 0.3 ? 1 : 0), rows = 7 + Math.floor(rnd() * 3), cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push({ r, c, at: 1.6 + rnd() * 9.5, v: { lean: (rnd() - .5) * 0.7, ph: 0.3 + rnd() * 0.7, side: rnd() < .5, r: 18 + rnd() * 12 } });
  const odd = Math.floor(rnd() * cells.length); if (!ITEMS[kind].diff) cells[odd].at = 1e9;
  S = { t: 0, f: 0, kind, pal, cols, rows, cells, odd, stopT: 12.3, revealT: 15.6 }; };
function draw() { const t = S.t, [C, b0, b1] = S.pal, it = ITEMS[S.kind]; bg(b1, b0);
  const gw = 860, gx = (W - gw) / 2, cw = gw / S.cols, ch = Math.min(118, 1000 / S.rows), gy = 520, s = Math.min(cw, ch) / 100;
  X.textAlign = 'left'; X.fillStyle = C; X.font = '900 96px Arial'; X.fillText('FOCUS TEST', 70, 250); X.fillStyle = '#fff'; X.font = '800 52px Arial'; X.fillText(it.q[0] + ' ' + it.q[1], 72, 325);
  X.textAlign = 'center'; X.font = '700 30px Arial'; X.fillStyle = 'rgba(255,255,255,.55)';
  for (let c = 0; c < S.cols; c++) X.fillText('ABCDEF'[c], gx + cw * (c + .5), gy - 40);
  for (let r = 0; r < S.rows; r++) X.fillText(String(r + 1), gx - 40, gy + ch * (r + .5) + 10);
  for (const cell of S.cells) { const k = Math.max(0, Math.min(1, (t - cell.at) / 0.6)); it.d(gx + cw * (cell.c + .5), gy + ch * (cell.r + .5), s, k, cell.v, C, cell === S.cells[S.odd]); }
  const by = gy + ch * S.rows + 70; X.textAlign = 'left';
  if (t < S.revealT) { X.fillStyle = '#fff'; X.font = '800 54px Arial'; X.fillText('Comment its letter + number.', 70, by); X.font = '600 34px Arial'; X.fillStyle = 'rgba(255,255,255,.65)'; X.fillText(t < S.stopT ? 'Watch closely… 👀' : 'Answer in 3… 2… 1…', 72, by + 55); }
  else { const o = S.cells[S.odd], k = Math.min(1, (t - S.revealT) / .35); X.strokeStyle = '#ffd23f'; X.lineWidth = 7; X.beginPath(); X.arc(gx + cw * (o.c + .5), gy + ch * (o.r + .5), Math.min(cw, ch) * (0.55 + 0.4 * (1 - k)), 0, 7); X.stroke();
    X.fillStyle = '#ffd23f'; X.font = '900 70px Arial'; X.fillText('Answer: ' + 'ABCDEF'[o.c] + (o.r + 1), 70, by + 10); X.font = '600 36px Arial'; X.fillStyle = 'rgba(255,255,255,.8)'; X.fillText('Did you spot it? 👇', 72, by + 65); }
  X.textAlign = 'center'; wm(); }
window.frame = (fast) => { const t0 = S.t; S.t += 1 / FPS; if (!ITEMS[S.kind].diff) for (const c of S.cells) if (c.at > t0 && c.at <= S.t) EV.push({ t: S.t, k: 'tick', p: 0.8 + Math.random() * 0.5 }); if (t0 < S.revealT && S.t >= S.revealT) EV.push({ t: S.t, k: 'win' }); if (t0 < S.stopT && S.t >= S.stopT) EV.push({ t: S.t, k: 'note', n: 4 });
  if (!fast) draw(); return out(fast, S.t > S.revealT + 3, { ok: true }); };
</script></body></html>
