<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script src="common.js"></script><script>
// "Marble race" — 6 marbles, zig-zag ramps, 3 laps (bottom → back to top). First to finish lap 3 wins; live ranking.
const SUB = 8, DT = 1 / (FPS * SUB), R = 24, LAPS = 2, TOPY = 430, BOT = 1640;
window.DUR = [25, 55];
window.init = (cfg) => { rnd = mulberry(cfg.seed || 7); const segs = [], n = 6, sp = (BOT - TOPY) / n;
  for (let i = 0; i < n; i++) { const y = TOPY + 40 + i * sp, l = i % 2 === 0, tilt = 105 + rnd() * 25; segs.push(l ? [20, y, 860, y + tilt] : [1060, y, 220, y + tilt]); }
  const pegs = []; for (let i = 0; i < 10; i++) pegs.push({ x: 200 + rnd() * 680, y: TOPY + 100 + rnd() * (BOT - TOPY - 160) });
  const pick = [0, 1, 2, 3, 4, 5, 6, 7].sort(() => rnd() - .5).slice(0, 6);
  S = { t: 0, f: 0, segs, pegs: pegs.filter(p => segs.every(s => dseg(p.x, p.y, s).d > 60)), m: pick.map((c, i) => ({ col: COLS[c], name: NAMES[c], x: 80 + i * 60, y: TOPY - 30 - (i % 2) * 30, vx: 0, vy: 0, lap: 0, fin: null, prog: 0 })), order: [], endT: null, intro: 1.2, lastT: 0, lapFlash: null }; };
function dseg(px, py, s) { const [x0, y0, x1, y1] = s, ex = x1 - x0, ey = y1 - y0, L2 = ex * ex + ey * ey, u = Math.max(0, Math.min(1, ((px - x0) * ex + (py - y0) * ey) / L2)), qx = x0 + ex * u, qy = y0 + ey * u; return { qx, qy, d: Math.hypot(px - qx, py - qy) }; }
function step() { const M = S.m.filter(b => b.fin === null);
  for (const b of M) { b.vy += 2800 * DT; b.x += b.vx * DT; b.y += b.vy * DT;
    if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx) * .5; } if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx) * .5; }
    for (const s of S.segs) { const q = dseg(b.x, b.y, s); if (q.d < R + 5 && q.d > 0) { const nx = (b.x - q.qx) / q.d, ny = (b.y - q.qy) / q.d; b.x = q.qx + nx * (R + 5); b.y = q.qy + ny * (R + 5); const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= 1.3 * vn * nx; b.vy -= 1.3 * vn * ny; if (-vn > 250 && S.t - S.lastT > .05) { S.lastT = S.t; EV.push({ t: S.t, k: 'hit', soft: 1 }); } } } }
    for (const p of S.pegs) { const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy); if (d < R + 14 && d > 0) { const nx = dx / d, ny = dy / d; b.x = p.x + nx * (R + 14); b.y = p.y + ny * (R + 14); const vn = b.vx * nx + b.vy * ny; if (vn < 0) { b.vx -= 1.7 * vn * nx; b.vy -= 1.7 * vn * ny; EV.push({ t: S.t, k: 'tick', p: 1.1 }); } } }
    const sp = Math.hypot(b.vx, b.vy); if (sp > 1900) { b.vx *= 1900 / sp; b.vy *= 1900 / sp; }
    if (b.y > BOT + 120) { b.lap++; if (b.lap >= LAPS) { b.fin = S.t; S.order.push(b); EV.push({ t: S.t, k: S.order.length === 1 ? 'win' : 'pop' }); if (S.order.length === 1) S.lapFlash = { s: b.name + ' FINISHES!', col: b.col, t: S.t }; }
      else { b.y = TOPY - 40; b.x = 60 + rnd() * 200; b.vx = 0; b.vy = 0; EV.push({ t: S.t, k: 'note', n: b.lap * 5 }); if (S.m.every(q => q === b || q.lap < b.lap)) S.lapFlash = { s: 'LAP ' + (b.lap + 1) + '/' + LAPS, col: b.col, t: S.t }; } }
    b.prog = b.lap * 10000 + b.y; }
  for (let i = 0; i < M.length; i++) for (let j = i + 1; j < M.length; j++) { const a = M[i], b = M[j]; if (a.lap !== b.lap) continue; const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < 2 * R && d > 0) { const nx = dx / d, ny = dy / d, ov = (2 * R - d) / 2; a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov; const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv < 0) { a.vx += rv * nx * .95; a.vy += rv * ny * .95; b.vx -= rv * nx * .95; b.vy -= rv * ny * .95; } } }
  if ((S.order.length >= 3 || S.t > 55) && S.endT === null) { S.endT = S.t; } }
function draw() { const t = S.t; bg('#0f2233', '#03070b');
  X.lineCap = 'round'; for (const s of S.segs) { X.strokeStyle = '#e8f6ff'; X.lineWidth = 12; X.shadowColor = '#7fd7ff'; X.shadowBlur = 20; X.beginPath(); X.moveTo(s[0], s[1]); X.lineTo(s[2], s[3]); X.stroke(); } X.shadowBlur = 0;
  for (const p of S.pegs) { X.fillStyle = '#ffd23f'; X.beginPath(); X.arc(p.x, p.y, 14, 0, 7); X.fill(); }
  X.fillStyle = 'rgba(255,255,255,.15)'; for (let i = 0; i < 27; i++) X.fillRect(i * 40, BOT + 110, 20, 10);
  const rank = [...S.m].sort((a, b) => (a.fin ?? 1e9) - (b.fin ?? 1e9) || b.prog - a.prog);
  for (const b of S.m) if (b.fin === null) ball(b.x, b.y, R, b.col);
  txt('MARBLE RACE', W / 2, 190, 90, '#fff'); txt(LAPS + ' LAPS — WHO WINS?', W / 2, 270, 48, '#ffd23f');
  rank.forEach((b, i) => { const x = 110 + i * 172; ball(x, 360, 26, b.col, 1, String(i + 1)); });
  txt('Pick your marble 👇', W / 2, 1800, 38, 'rgba(255,255,255,.8)'); wm();
  if (S.lapFlash && t - S.lapFlash.t < 1 && !S.endT) { const k = t - S.lapFlash.t; X.save(); X.translate(W / 2, 1000); X.scale(back(k / .25), back(k / .25)); txt(S.lapFlash.s, 0, 0, 90, S.lapFlash.col, 10); X.restore(); }
  if (S.f / FPS < S.intro) { X.fillStyle = 'rgba(0,0,0,.4)'; X.fillRect(0, 0, W, H); txt('PICK ONE!', W / 2, 1000, 130, '#ffd23f', 10); }
  if (S.endT !== null) { const w = S.order[0] || rank[0]; endCard(t - S.endT, w.name + ' WINS! 🏆', w.col, 'Did your marble win? 👇'); } }
window.frame = (fast) => { if (S.f / FPS >= S.intro && S.endT === null) { for (let i = 0; i < SUB; i++) { step(); S.t += DT; if (S.endT !== null) break; } } else S.t += 1 / FPS; if (!fast) draw(); return out(fast, S.endT !== null && S.t - S.endT > 3.5, { ok: S.order.length > 0 }); };
</script></body></html>
