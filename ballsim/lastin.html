<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script src="common.js"></script><script>
// "Last ball inside wins" — numbered balls bounce in a ring with a rotating gap; escape = out.
const CX = 540, CY = 1020, R = 430, SUB = 6, DT = 1 / (FPS * SUB);
window.DUR = [25, 55];
window.init = (cfg) => { rnd = mulberry(cfg.seed || 7); const n = 8 + Math.floor(rnd() * 3);
  S = { t: 0, f: 0, rot: rnd() * 6.28, w: (0.7 + rnd() * 0.6) * (rnd() < .5 ? 1 : -1), gap: 0.34, balls: [], outs: [], banner: null, endT: null, winner: null, intro: 1.2 };
  for (let i = 0; i < n; i++) { const a = i / n * 6.28, d = rnd() * 6.28, sp = 420 + rnd() * 120; S.balls.push({ id: i + 1, col: COLS[i % COLS.length], x: CX + Math.cos(a) * 180, y: CY + Math.sin(a) * 180, vx: Math.cos(d) * sp, vy: Math.sin(d) * sp, sp, r: 40, alive: true }); } };
const angIn = (a) => { let d = ((a - S.rot) % 6.283 + 6.283) % 6.283; return d < S.gap; };
function step() { S.rot += S.w * DT; S.gap = Math.min(1.3, 0.34 + S.t * 0.012); const B = S.balls.filter(b => b.alive);
  for (const b of B) { b.x += b.vx * DT; b.y += b.vy * DT; const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy);
    if (d > R - b.r) { if (angIn(Math.atan2(dy, dx))) { if (d > R + b.r) { b.alive = false; S.outs.push({ ...b, t: S.t }); S.banner = { s: '#' + b.id + ' OUT!', col: b.col, t: S.t }; EV.push({ t: S.t, k: 'pop' });
          const L = S.balls.filter(q => q.alive); if (L.length === 1) { S.winner = L[0]; S.endT = S.t; EV.push({ t: S.t + .3, k: 'win' }); } } continue; }
      const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny; if (vn > 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; const j = (rnd() - .5) * .2, c = Math.cos(j), s = Math.sin(j); [b.vx, b.vy] = [b.vx * c - b.vy * s, b.vx * s + b.vy * c]; EV.push({ t: S.t, k: 'tick', p: .7 + b.id * .05 }); }
      b.x = CX + nx * (R - b.r); b.y = CY + ny * (R - b.r); } }
  for (let i = 0; i < B.length; i++) for (let j = i + 1; j < B.length; j++) { const a = B[i], b = B[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
    if (d < m && d > 0) { const nx = dx / d, ny = dy / d, ov = (m - d) / 2; a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov; const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) { a.vx += rv * nx; a.vy += rv * ny; b.vx -= rv * nx; b.vy -= rv * ny; for (const q of [a, b]) { const s = Math.hypot(q.vx, q.vy) || 1; q.vx *= q.sp / s; q.vy *= q.sp / s; } EV.push({ t: S.t, k: 'hit', soft: 1 }); } } } }
function draw() { const t = S.t; bg('#1d1240', '#060312');
  X.lineWidth = 14; X.strokeStyle = '#fff'; X.shadowColor = '#a98bff'; X.shadowBlur = 30; X.beginPath(); X.arc(CX, CY, R + 7, S.rot + S.gap, S.rot + 6.283); X.stroke(); X.shadowBlur = 0;
  for (const o of S.outs) { const k = t - o.t; if (k > 1.4) continue; ball(o.x + o.vx * k, o.y + o.vy * k + 400 * k * k, o.r, o.col, 1 - k / 1.4, String(o.id)); }
  for (const b of S.balls) if (b.alive) ball(b.x, b.y, b.r, b.col, 1, String(b.id));
  txt('LAST BALL INSIDE', W / 2, 200, 78, '#fff'); txt('WINS!', W / 2, 290, 78, '#ffd23f');
  txt(S.balls.filter(b => b.alive).length + ' LEFT', W / 2, 380, 46, '#c9b8ff');
  const L = S.balls, cw = 96, sx = W / 2 - (L.length - 1) * cw / 2; L.forEach((b, i) => { ball(sx + i * cw, 1600, 32, b.col, b.alive ? 1 : .25, String(b.id)); });
  txt('Pick a number 👇', W / 2, 1720, 40, 'rgba(255,255,255,.8)'); wm();
  if (S.banner && t - S.banner.t < 1 && !S.winner) { const k = t - S.banner.t; X.save(); X.translate(W / 2, 480); X.scale(back(k / .25), back(k / .25)); X.fillStyle = S.banner.col; X.beginPath(); X.roundRect(-220, -55, 440, 100, 24); X.fill(); txt(S.banner.s, 0, 22, 62, '#fff', 6); X.restore(); }
  if (S.f / FPS < S.intro) { X.fillStyle = 'rgba(0,0,0,.4)'; X.fillRect(0, 0, W, H); txt('PICK ONE!', W / 2, CY, 130, '#ffd23f', 10); }
  if (S.winner) endCard(t - S.endT, '#' + S.winner.id + ' WINS! 🏆', S.winner.col, 'Was it your pick? 👇'); }
window.frame = (fast) => { if (S.f / FPS >= S.intro && !S.winner) { for (let i = 0; i < SUB; i++) { step(); S.t += DT; if (S.winner) break; } } else S.t += 1 / FPS; if (!fast) draw(); return out(fast, S.winner && S.t - S.endT > 3.5, { ok: !!S.winner }); };
</script></body></html>
