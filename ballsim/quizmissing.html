<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script src="common.js"></script><script>
// "Which number is missing?" — 1..N float around the screen, one is missing. 10-second timer, then reveal.
window.DUR = [15, 20];
function ctext(s, x, y) { const a = X.textAlign; X.textAlign = 'left'; X.fillText(s, x - X.measureText(s).width / 2, y); X.textAlign = a; }

const PASTEL = ['#ffd23f', '#7cf2a0', '#7fc8ff', '#ff9fc8', '#c9a8ff', '#ffb36b', '#9ff0ff'];
window.init = (cfg) => { rnd = mulberry(cfg.seed || 7); const N = [20, 25, 30, 30, 40][Math.floor(rnd() * 5)], miss = 1 + Math.floor(rnd() * N), nums = [];
  const cols = N > 30 ? 6 : 5, rows = Math.ceil((N - 1) / cols), cells = []; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([c, r]); cells.sort(() => rnd() - .5);
  let i = 0; for (let v = 1; v <= N; v++) { if (v === miss) continue; const [c, r] = cells[i++]; nums.push({ v, x: 110 + (860 / (cols - 1)) * c + (rnd() - .5) * 90, y: 600 + (960 / Math.max(1, rows - 1)) * r + (rnd() - .5) * 70, col: PASTEL[Math.floor(rnd() * PASTEL.length)], sz: 70 + rnd() * 40, ph: rnd() * 6.28, rot: (rnd() - .5) * 0.4 }); }
  const th = [['#1f1d3a', '#2c2a55'], ['#12263a', '#1d3d5c'], ['#2a1830', '#45264f'], ['#0f2a24', '#1a453b']][Math.floor(rnd() * 4)];
  S = { t: 0, f: 0, N, miss, nums, th, revealT: 12.5 }; };
function draw() { const t = S.t; bg(S.th[1], S.th[0]); X.textAlign = 'center';
  X.fillStyle = '#fff'; X.font = '900 76px Arial'; ctext('Which number from', W / 2, 260); const a1 = '1 to ' + S.N + ' ', a2 = 'is missing?', w1 = X.measureText(a1).width, w2 = X.measureText(a2).width, sx = W / 2 - (w1 + w2) / 2; X.textAlign = 'left'; X.fillStyle = '#ffd23f'; X.fillText(a1, sx, 350); X.fillStyle = '#fff'; X.fillText(a2, sx + w1, 350); X.textAlign = 'center';
  X.font = '600 38px Arial'; X.fillStyle = 'rgba(255,255,255,.7)'; X.fillText('Comment the number 👇', W / 2, 420);
  for (const n of S.nums) { const k = Math.min(1, Math.max(0, (t - 0.2 - (n.v % 10) * 0.05) / 0.4)), fy = Math.sin(t * 1.3 + n.ph) * 10; X.save(); X.translate(n.x, n.y + fy); X.rotate(n.rot + Math.sin(t + n.ph) * 0.05); X.scale(back(k), back(k));
    X.font = `900 ${Math.round(n.sz)}px Arial`; X.lineWidth = 8; X.strokeStyle = 'rgba(0,0,0,.25)'; X.strokeText(n.v, 0, 0); X.fillStyle = n.col; X.fillText(n.v, 0, 0); X.restore(); }
  const left = Math.max(0, Math.ceil(S.revealT - 0.5 - t));
  if (t < S.revealT) { X.fillStyle = 'rgba(255,255,255,.12)'; X.fillRect(140, 1760, 800, 18); X.fillStyle = left <= 3 ? '#ff4d6d' : '#7cf2a0'; X.fillRect(140, 1760, 800 * Math.max(0, 1 - t / (S.revealT - 0.5)), 18); X.font = '800 46px Arial'; X.fillStyle = '#fff'; X.fillText('⏱ ' + left, W / 2, 1735); }
  else { const k = Math.min(1, (t - S.revealT) / 0.4); X.fillStyle = `rgba(0,0,0,${0.55 * k})`; X.fillRect(0, 0, W, H); X.save(); X.translate(W / 2, 1050); X.scale(back(k), back(k)); X.font = '800 60px Arial'; X.fillStyle = '#fff'; X.fillText('The missing number is', 0, -150); X.font = '900 260px Arial'; X.fillStyle = '#ffd23f'; X.fillText(S.miss, 0, 90); X.restore(); X.font = '600 40px Arial'; X.fillStyle = 'rgba(255,255,255,.85)'; X.fillText('Did you get it? 👇', W / 2, 1400); }
  wm(); }
window.frame = (fast) => { const t0 = S.t; S.t += 1 / FPS; if (Math.floor(t0) !== Math.floor(S.t) && S.t < S.revealT) EV.push({ t: S.t, k: 'tick', p: 1 }); if (t0 < S.revealT && S.t >= S.revealT) EV.push({ t: S.t, k: 'win' }); if (!fast) draw(); return out(fast, S.t > S.revealT + 3, { ok: true }); };
</script></body></html>
