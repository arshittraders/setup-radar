<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BD;src:url(baloo-2-devanagari-800-normal.woff2)}@font-face{font-family:BD;src:url(baloo-2-latin-800-normal.woff2)}@font-face{font-family:BG;src:url(bangers-latin-400-normal.woff2)}
*{margin:0;padding:0}body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#bg{position:absolute;inset:0}#ch{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;font:800 64px/1.25 BD;color:#fff;-webkit-text-stroke:12px #1d1030;paint-order:stroke fill}
#cap .hl{color:#ffd23f}
#bub{position:absolute;left:40px;top:640px;width:640px;padding:30px 36px;border-radius:40px;background:#fff;border:7px solid #1d1030;font:800 54px/1.25 BD;color:#1d1030;box-shadow:10px 12px 0 rgba(0,0,0,.18);opacity:0}
#bub b{display:block;font-size:34px;color:#c0392b;margin-bottom:6px}
#bub:after{content:"";position:absolute;left:60px;bottom:-46px;border:24px solid transparent;border-top:28px solid #1d1030}
#top{position:absolute;top:40px;left:0;right:0;text-align:center}
#top span{display:inline-block;padding:14px 34px;border-radius:999px;background:#ff8a1f;color:#fff;font:800 40px BD;border:6px solid #1d1030}
#emo{position:absolute;font-size:150px;opacity:0}
#hah{position:absolute;left:0;right:0;top:1180px;text-align:center;font:400 120px BG;color:#ffd23f;-webkit-text-stroke:8px #1d1030;paint-order:stroke fill;opacity:0;letter-spacing:4px}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<svg id="ch" viewBox="0 0 1080 1920"><g id="tg"></g></svg>
<div id="top"><span>😜 टिंगू की पाठशाला</span></div>
<div id="bub"><b>👩‍🏫 मैडम</b><span id="bt"></span></div>
<div id="emo"></div><div id="hah">HA HA HA!</div>
<div id="cap"></div>
<script src="chars_t.js"></script><script>
const $=id=>document.getElementById(id),cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),eo=v=>1-Math.pow(1-cl(v),3);
window.L=window.L||[];window.AMP=window.AMP||{};
const x=$('bg').getContext('2d');
function room(t){ // classroom
  const g=x.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#fff3d6');g.addColorStop(.62,'#ffe3b0');g.addColorStop(.63,'#c98d5a');g.addColorStop(1,'#a8703f');x.fillStyle=g;x.fillRect(0,0,1080,1920);
  for(let i=0;i<14;i++){x.fillStyle=i%2?'rgba(150,95,50,.18)':'rgba(255,255,255,.08)';x.fillRect(0,1190+i*52,1080,26)}
  // blackboard
  x.fillStyle='#7a4a24';x.fillRect(60,130,960,470);x.fillStyle='#24453a';x.fillRect(80,150,920,430);
  x.strokeStyle='rgba(255,255,255,.08)';x.lineWidth=40;x.beginPath();x.moveTo(150,520);x.lineTo(500,200);x.stroke();
  x.fillStyle='rgba(255,255,255,.85)';x.font='800 64px BD';x.textAlign='left';const B=window.BOARD||['आज का पाठ:','होमवर्क ✍️','2 + 2 = ?'];x.fillText(B[0],580,260);x.font='800 56px BD';x.fillText(B[1],620,350);x.font='800 46px BD';x.fillText(B[2],630,440);
  x.fillStyle='#d9b37a';x.fillRect(80,580,920,18);x.fillStyle='#fff';x.fillRect(820,566,40,14);
  // window
  x.fillStyle='#8fd3ff';x.fillRect(80,690,260,300);x.fillStyle='#fff';x.fillRect(80,830,260,14);x.fillRect(204,690,14,300);x.strokeStyle='#7a4a24';x.lineWidth=14;x.strokeRect(80,690,260,300);
  x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.ellipse(150+Math.sin(t*.3)*20,740,50,18,0,0,7);x.fill();
  // clock
  x.fillStyle='#fff';x.beginPath();x.arc(900,760,70,0,7);x.fill();x.strokeStyle='#1d1030';x.lineWidth=8;x.stroke();x.lineWidth=6;x.beginPath();x.moveTo(900,760);x.lineTo(900+Math.cos(t-1.57)*50,760+Math.sin(t-1.57)*50);x.moveTo(900,760);x.lineTo(930,740);x.stroke();
  // desk in front of Tingu
  x.fillStyle='#c4864c';x.beginPath();x.roundRect(380,1300,620,60,16);x.fill();x.fillStyle='#9c6533';x.fillRect(420,1360,40,240);x.fillRect(920,1360,40,240);
  x.fillStyle='#e53950';x.save();x.translate(470,1270);x.rotate(-.08);x.fillRect(0,0,150,34);x.fillStyle='#fff';x.fillRect(8,6,134,6);x.restore()}
function render(t){
  room(t);
  const cur=L.find(l=>t>=l.s-.05&&t<l.e+.25),last=[...L].reverse().find(l=>t>=l.s);
  // Tingu
  let m=0,mood='smile',pose='idle',dir=-1;
  if(cur&&cur.who==='T'){const k=Math.floor((t-cur.s)*30);const a=(AMP[cur.i]||[])[k]||0;m=cl(a*2.2);mood=cur.mood||'smug';pose=cur.pose||'talk';dir=1}
  else if(cur&&cur.who==='M'){mood=cur.lmood||'smile';pose='idle';dir=-1}
  if(last&&last.who==='T'&&t>last.e&&t<last.e+1.3){mood='laugh';pose='laugh'}
  const blink=(t*1000%3300)<120;
  $('tg').innerHTML=`<g transform="translate(640,1720) scale(1.3)">${TOON.draw('T',{t,m,mood,pose,dir,blink})}</g>`;
  // madam bubble
  const b=$('bub');if(cur&&cur.who==='M'){const p=eo((t-cur.s)/.25);b.style.opacity=1;b.style.transform=`scale(${.6+.4*p}) rotate(-2deg)`;$('bt').textContent=cur.text}else b.style.opacity=Math.max(0,+b.style.opacity-.15);
  // caption (Tingu lines)
  const c=$('cap');if(cur&&cur.who==='T'){const w=cur.text.split(' '),k=Math.floor((t-cur.s)/(cur.e-cur.s)*w.length);c.innerHTML=w.map((s,i)=>i<=k?`<span class="hl">${s}</span>`:s).join(' ');c.style.opacity=1}else c.style.opacity=0;
  // punch emoji + HA HA
  const e=$('emo'),h=$('hah');if(last&&last.who==='T'&&last.emoji&&t>last.e&&t<last.e+1.2){const k=(t-last.e)/1.2;e.textContent=last.emoji;e.style.opacity=1-k;e.style.left='780px';e.style.top=(780-k*200)+'px';e.style.transform=`scale(${.6+k*.8}) rotate(${k*30}deg)`;h.style.opacity=1-k;h.style.transform=`scale(${1+Math.sin(k*20)*.06})`}else{e.style.opacity=0;h.style.opacity=0}
}
window.render=render;
</script></body></html>
