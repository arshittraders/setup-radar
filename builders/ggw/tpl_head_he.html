<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:BD;src:url(baloo-2-devanagari-800-normal.woff2)}
@font-face{font-family:BD;src:url(baloo-2-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000}

  text-shadow:0 0 18px rgba(0,0,0,.9),0 6px 0 #000,3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
#cap span{display:inline-block;margin:0 10px;transition:none}
#cap .on{color:#ffd23f;transform:scale(1.12)}

#title{position:absolute;left:0;right:0;top:230px;text-align:center;font-family:BD;font-weight:800;color:#ffd23f;font-size:120px;line-height:1.05;
  text-shadow:0 0 30px rgba(255,170,0,.6),0 8px 0 #5a3500,4px 4px 0 #000,-4px -4px 0 #000}

#tag span{display:inline-block;padding:10px 26px;border:3px solid #7CFF6B;color:#7CFF6B;border-radius:999px;font:800 30px BD,sans-serif;letter-spacing:4px;background:rgba(0,0,0,.45)}
.badge{position:absolute;font-family:BD;font-weight:800;color:#fff;background:linear-gradient(180deg,#ffb703,#fb8500);border:5px solid #fff3;border-radius:28px;padding:10px 34px;font-size:78px;box-shadow:0 20px 50px rgba(0,0,0,.6);opacity:0;white-space:nowrap}

</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas><canvas id="c2" width="1080" height="1920" style="opacity:0"></canvas>
<div id="vig"></div>
<div id="tag"><span>📜 HISTORY EK MIN MEIN</span></div>
<div id="title"></div>
<div class="badge" id="b1" style="left:90px;top:430px"></div>
<div class="badge" id="b2" style="right:90px;top:600px"></div>
<div id="cap"></div>

<script src="ep.js"></script><script>
const W=1080,H=1920,cv=document.getElementById('c'),cv2=document.getElementById('c2');let x=cv.getContext('2d');const x1=x,x2=cv2.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), eo=v=>1-Math.pow(1-v,3), pr=(t,a,d)=>cl((t-a)/d);
let sd=7;const R=()=>((sd=(sd*16807)%2147483647)/2147483647);
const STARS=Array.from({length:420},()=>({x:R()*W*1.6-W*.3,y:R()*H*1.1-H*.1,r:R()*2.2+.3,p:R()*6}));
const DUST=Array.from({length:90},()=>({x:R()*W,y:R()*H,s:R()*2+.5,v:R()*20+10}));
// ---------- drawing helpers ----------
function sky(t,top='#05071a',mid='#1a1240',bot='#4a2a3a'){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(.55,mid);g.addColorStop(.8,bot);g.addColorStop(1,'#c46b2c');x.fillStyle=g;x.fillRect(-W,-H,W*3,H*3);
  for(const s of STARS){const a=.45+.55*Math.sin(t*2+s.p);x.globalAlpha=a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}x.globalAlpha=1;
  const mg=x.createRadialGradient(820,380,10,820,380,260);mg.addColorStop(0,'rgba(255,240,210,.95)');mg.addColorStop(.25,'rgba(255,220,170,.35)');mg.addColorStop(1,'rgba(255,200,150,0)');x.fillStyle=mg;x.fillRect(500,80,640,640)}
function dunes(t,y0=1350){const L=[['#3b2316',0],['#5b3620',60],['#7a4a26',140]];L.forEach(([c,o],i)=>{x.fillStyle=c;x.beginPath();x.moveTo(-W,H*2);for(let X=-W;X<=W*2;X+=20)x.lineTo(X,y0+o+Math.sin(X/(300+i*90)+i+t*.05)*40);x.lineTo(W*2,H*2);x.fill()})}
function pyr(cx,by,w,h,lit=1,glow=0){ // front-ish 3/4 view pyramid with two faces + block lines
  const ax=cx+w*.12,ay=by-h;x.fillStyle=`rgb(${200*lit|0},${150*lit|0},${90*lit|0})`;x.beginPath();x.moveTo(cx-w/2,by);x.lineTo(ax,ay);x.lineTo(cx+w*.18,by+10);x.fill();
  x.fillStyle=`rgb(${120*lit|0},${80*lit|0},${50*lit|0})`;x.beginPath();x.moveTo(cx+w*.18,by+10);x.lineTo(ax,ay);x.lineTo(cx+w/2,by);x.fill();
  x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=2;const n=Math.max(6,h/22|0);for(let i=1;i<n;i++){const f=i/n,yy=by-(h*f),lx=cx-w/2+(ax-(cx-w/2))*f,rx=cx+w/2+(ax-(cx+w/2))*f,mx=cx+w*.18+(ax-(cx+w*.18))*f;x.beginPath();x.moveTo(lx,yy);x.lineTo(mx,yy+10*(1-f));x.lineTo(rx,yy);x.stroke()}
  if(glow){const g=x.createRadialGradient(ax,ay,0,ax,ay,160);g.addColorStop(0,`rgba(140,255,120,${.8*glow})`);g.addColorStop(1,'rgba(140,255,120,0)');x.fillStyle=g;x.fillRect(ax-160,ay-160,320,320)}}
function rays(t,cx,cy,col='255,220,160',a=.12){x.save();x.translate(cx,cy);x.globalCompositeOperation='lighter';for(let i=0;i<9;i++){const an=-1.9+i*.16+Math.sin(t*.4+i)*.04;x.rotate(0);x.fillStyle=`rgba(${col},${a*(.5+.5*Math.sin(t*.8+i*1.7))})`;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(an-.035)*2200,Math.sin(an-.035)*2200);x.lineTo(Math.cos(an+.035)*2200,Math.sin(an+.035)*2200);x.fill()}x.restore()}
function embers(t,col='255,190,120'){x.save();x.globalCompositeOperation='lighter';for(let i=0;i<60;i++){const yy=H-((t*60+i*97)%(H+200));const xx=(i*173)%W+Math.sin(t+i)*30;x.fillStyle=`rgba(${col},${.25+.25*Math.sin(t*3+i)})`;x.beginPath();x.arc(xx,yy,2+(i%3),0,7);x.fill()}x.restore()}
function dust(t){x.fillStyle='rgba(255,220,170,.5)';for(const d of DUST){const yy=(d.y+t*d.v)%H;x.globalAlpha=.25;x.beginPath();x.arc((d.x+Math.sin(t+d.y)*20),yy,d.s,0,7);x.fill()}x.globalAlpha=1}
function cam(z,ox=0,oy=0,rot=0){x.setTransform(1,0,0,1,0,0);x.translate(W/2,H/2);x.rotate(rot);x.scale(z,z);x.translate(-W/2+ox,-H/2+oy)}
function ufo(cx,cy,s,t,beam=0){x.save();x.translate(cx,cy);x.scale(s,s);
  if(beam>0){const g=x.createLinearGradient(0,0,0,700);g.addColorStop(0,`rgba(150,255,140,${.55*beam})`);g.addColorStop(1,'rgba(150,255,140,0)');x.fillStyle=g;x.beginPath();x.moveTo(-60,20);x.lineTo(60,20);x.lineTo(260,720);x.lineTo(-260,720);x.fill()}
  const g2=x.createRadialGradient(0,0,10,0,0,220);g2.addColorStop(0,'rgba(140,255,120,.45)');g2.addColorStop(1,'rgba(140,255,120,0)');x.fillStyle=g2;x.fillRect(-220,-220,440,440);
  x.fillStyle='#9fb3c8';x.beginPath();x.ellipse(0,0,170,44,0,0,7);x.fill();x.fillStyle='#d8e6f3';x.beginPath();x.ellipse(0,-8,170,30,0,Math.PI,0);x.fill();
  x.fillStyle='rgba(170,255,200,.85)';x.beginPath();x.ellipse(0,-30,70,48,0,Math.PI,0);x.fill();
  for(let i=0;i<7;i++){const a=i/7*6.283+t*3;x.fillStyle=Math.sin(t*8+i)>0?'#7CFF6B':'#ffd23f';x.beginPath();x.arc(Math.cos(a)*130,8+Math.sin(a)*12,8,0,7);x.fill()}x.restore()}
function block(cx,cy,w,h){x.fillStyle='#b98a55';x.fillRect(cx-w/2,cy-h/2,w,h);x.fillStyle='#8d6438';x.fillRect(cx-w/2,cy+h/2-12,w,12);x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=3;x.strokeRect(cx-w/2,cy-h/2,w,h)}
function man(px,py,s,lean=0){x.save();x.translate(px,py);x.scale(s,s);x.rotate(lean);x.fillStyle='#1b0f08';x.beginPath();x.arc(0,-62,10,0,7);x.fill();x.fillRect(-6,-52,12,34);x.save();x.translate(0,-48);x.rotate(-.9);x.fillRect(0,-3,28,6);x.restore();x.fillRect(-6,-20,5,26);x.fillRect(2,-20,5,26);x.restore()}
function egypt(px,py,s,armUp=0,col='#3a1e0e'){x.save();x.translate(px,py);x.scale(s,s);x.fillStyle=col;x.beginPath();x.arc(0,-150,22,0,7);x.fill();x.fillRect(-8,-180,16,14);x.fillRect(-20,-128,40,70);x.beginPath();x.moveTo(-24,-58);x.lineTo(24,-58);x.lineTo(30,0);x.lineTo(-30,0);x.fill();x.save();x.translate(18,-120);x.rotate(-armUp);x.fillRect(0,-5,50,10);x.restore();x.save();x.translate(-18,-120);x.rotate(Math.PI+armUp);x.fillRect(0,-5,50,10);x.restore();x.restore()}
function alienFig(px,py,s,glow){x.save();x.translate(px,py);x.scale(s,s);const g=x.createRadialGradient(0,-120,0,0,-120,200);g.addColorStop(0,`rgba(140,255,120,${.6*glow})`);g.addColorStop(1,'rgba(140,255,120,0)');x.fillStyle=g;x.fillRect(-200,-320,400,400);
  x.fillStyle='#3a1e0e';x.beginPath();x.ellipse(0,-170,34,44,0,0,7);x.fill();x.fillStyle=`rgba(140,255,120,${.4+.6*glow})`;x.beginPath();x.ellipse(-14,-172,10,16,.4,0,7);x.ellipse(14,-172,10,16,-.4,0,7);x.fill();
  x.fillStyle='#3a1e0e';x.fillRect(-18,-128,36,70);x.fillRect(-14,-58,10,58);x.fillRect(4,-58,10,58);x.save();x.translate(16,-120);x.rotate(-.4);x.fillRect(0,-4,60,8);x.restore();x.save();x.translate(-16,-120);x.rotate(Math.PI+.4);x.fillRect(0,-4,60,8);x.restore();x.restore()}



function ocean(t,top='#0a1530',mid='#13305a'){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,mid);x.fillStyle=g;x.fillRect(-W,-H,W*3,H*3);
  for(let i=0;i<60;i++){x.strokeStyle='rgba(160,210,255,.12)';x.lineWidth=4;const yy=(i*97)%H,xx=((i*211)+t*60)%(W+400)-200;x.beginPath();x.moveTo(xx,yy);x.quadraticCurveTo(xx+40,yy-10,xx+80,yy);x.stroke()}}
function plane(px,py,s,a=1,rot=0){x.save();x.translate(px,py);x.rotate(rot);x.scale(s,s);x.globalAlpha=a;x.fillStyle='#c9d4de';x.beginPath();x.ellipse(0,0,70,12,0,0,7);x.fill();x.beginPath();x.moveTo(-10,0);x.lineTo(-30,-60);x.lineTo(10,-60);x.lineTo(20,0);x.lineTo(10,60);x.lineTo(-30,60);x.fill();x.beginPath();x.moveTo(-60,0);x.lineTo(-75,-25);x.lineTo(-60,-25);x.lineTo(-50,0);x.fill();x.globalAlpha=1;x.restore()}
function ship(px,py,s,a=1){x.save();x.translate(px,py);x.scale(s,s);x.globalAlpha=a;x.fillStyle='#3a2a20';x.beginPath();x.moveTo(-120,0);x.lineTo(120,0);x.lineTo(90,50);x.lineTo(-90,50);x.fill();x.fillStyle='#d9d0c0';x.fillRect(-40,-110,80,110);x.fillStyle='#b23a2a';x.fillRect(-10,-150,20,50);x.globalAlpha=1;x.restore()}
function gear(cx,cy,r,teeth,ang,col='#b8863b'){x.save();x.translate(cx,cy);x.rotate(ang);x.fillStyle=col;x.beginPath();for(let i=0;i<teeth*2;i++){const a=i/(teeth*2)*6.283,rr=i%2?r:r*1.14;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill();x.strokeStyle='#5a3d14';x.lineWidth=4;x.stroke();x.fillStyle='rgba(60,40,10,.6)';x.beginPath();x.arc(0,0,r*.55,0,7);x.fill();x.fillStyle=col;for(let i=0;i<4;i++){x.save();x.rotate(i*1.57);x.fillRect(-r*.08,0,r*.16,r*.55);x.restore()}x.beginPath();x.arc(0,0,r*.15,0,7);x.fill();x.restore()}
function storm(t,a){x.save();x.globalAlpha=a;for(let i=0;i<8;i++){x.strokeStyle='rgba(200,220,255,.35)';x.lineWidth=6;x.beginPath();for(let k=0;k<60;k++){const ang=k*.18+t*1.5+i*.8,rr=40+k*9;x.lineTo(540+Math.cos(ang)*rr,1000+Math.sin(ang)*rr*.5)}x.stroke()}if(Math.sin(t*7)>.85){x.fillStyle='rgba(255,255,255,.35)';x.fillRect(-W,-H,W*3,H*3)}x.restore()}


// ---- extra helpers ----
function txt(s,px,py,size,col='#ffd23f',a=1,font='BD'){x.save();x.globalAlpha=a;x.font=`800 ${size}px ${font}`;x.textAlign='center';x.lineWidth=size/10;x.strokeStyle='#000';x.strokeText(s,px,py);x.fillStyle=col;x.fillText(s,px,py);x.restore()}
function emo(s,px,py,size,a=1){x.save();x.globalAlpha=a;x.font=`800 ${size}px "Noto Color Emoji"`;x.textAlign='center';x.fillText(s,px,py);x.restore()}
function under(t,top='#023047',bot='#001219'){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);x.fillStyle=g;x.fillRect(-W,-H,W*3,H*3);
  x.save();x.globalCompositeOperation='lighter';for(let i=0;i<7;i++){const xx=100+i*150+Math.sin(t*.5+i)*40;const gg=x.createLinearGradient(xx,0,xx+120,H);gg.addColorStop(0,'rgba(120,200,255,.13)');gg.addColorStop(1,'rgba(120,200,255,0)');x.fillStyle=gg;x.beginPath();x.moveTo(xx,-100);x.lineTo(xx+60,-100);x.lineTo(xx+220,H);x.lineTo(xx+120,H);x.fill()}x.restore();
  for(let i=0;i<45;i++){x.fillStyle='rgba(180,230,255,.35)';x.beginPath();x.arc((i*233+Math.sin(t+i)*20)%W,H-((i*97+t*90)%H),2+(i%4),0,7);x.fill()}}
function ruins(cx,by,s,col='#4f6b6b',gold=0){x.save();x.translate(cx,by);x.scale(s,s);const c=gold?'#e0a83a':col,c2=gold?'#b07a1c':'#3a5050';
  for(let i=-3;i<=3;i++){const h=(i%2?220:300)-Math.abs(i)*20;x.fillStyle=c;x.fillRect(i*110-28,-h,56,h);x.fillStyle=c2;x.fillRect(i*110-36,-h-18,72,18)}
  x.fillStyle=c2;x.fillRect(-380,0,760,40);if(gold){x.fillStyle=c;for(const [dx,dr] of [[-220,70],[0,110],[220,70]]){x.beginPath();x.arc(dx,-330-dr*.2,dr,Math.PI,0);x.fill();x.fillRect(dx-6,-430-dr*.6,12,60)}}x.restore()}
function diver(px,py,s,t){x.save();x.translate(px,py);x.scale(s,s);x.rotate(-.25+Math.sin(t*2)*.05);x.fillStyle='#111';x.beginPath();x.ellipse(0,0,90,26,0,0,7);x.fill();x.fillStyle='#ffb703';x.fillRect(-50,-46,70,22);x.fillStyle='#8ecae6';x.beginPath();x.arc(95,-6,22,0,7);x.fill();
  x.fillStyle='#111';const k=Math.sin(t*6)*.4;x.save();x.translate(-85,0);x.rotate(k);x.fillRect(-60,-6,60,12);x.fillStyle='#219ebc';x.fillRect(-100,-14,40,28);x.restore();x.restore()}
function wave(t,p){x.save();x.fillStyle='rgba(30,90,160,.92)';x.beginPath();x.moveTo(-50,H);for(let X=-50;X<=W+50;X+=20)x.lineTo(X,H-(H*1.1)*p+Math.sin(X/90+t*4)*40);x.lineTo(W+50,H);x.fill();x.fillStyle='rgba(255,255,255,.6)';for(let X=-50;X<=W+50;X+=60){x.beginPath();x.arc(X,H-(H*1.1)*p+Math.sin(X/90+t*4)*40,14,0,7);x.fill()}x.restore()}
function pillar(cx,by,s,shine=0){x.save();x.translate(cx,by);x.scale(s,s);const g=x.createLinearGradient(-50,0,50,0);g.addColorStop(0,'#2b2b33');g.addColorStop(.45,'#6b6b78');g.addColorStop(.55,'#8a8a96');g.addColorStop(1,'#26262e');x.fillStyle=g;x.fillRect(-45,-900,90,900);
  x.fillStyle='#4a4a55';x.fillRect(-70,-960,140,30);x.beginPath();x.ellipse(0,-990,60,40,0,0,7);x.fill();x.fillRect(-40,-1060,80,40);x.fillStyle='#55555f';x.fillRect(-90,-20,180,30);
  x.fillStyle='rgba(255,255,255,.35)';x.font='800 24px BD';x.save();x.translate(0,-700);x.fillText('',0,0);x.restore();
  if(shine){const sg=x.createLinearGradient(-45,-900+((shine*1200)%1300)-200,45,-900+((shine*1200)%1300));sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.45)');sg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sg;x.fillRect(-45,-900,90,900)}x.restore()}
function qutub(cx,by,s){x.save();x.translate(cx,by);x.scale(s,s);x.fillStyle='#8a4b2a';for(let i=0;i<5;i++){const w=150-i*22,h=230-i*20,y=-i*230;x.beginPath();x.moveTo(-w/2,y);x.lineTo(-w/2+10,y-h);x.lineTo(w/2-10,y-h);x.lineTo(w/2,y);x.fill();x.fillStyle='#6b3820';x.fillRect(-w/2-8,y-h-14,w+16,14);x.fillStyle='#8a4b2a'}x.restore()}
function desert(t,top='#0b1026',bot='#3a2440'){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(.7,bot);g.addColorStop(1,'#a0522d');x.fillStyle=g;x.fillRect(-W,-H,W*3,H*3);for(const s of STARS){x.globalAlpha=.4+.5*Math.sin(t*2+s.p);x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y*.7,s.r,0,7);x.fill()}x.globalAlpha=1;dunes(t,1450)}
function debris(cx,cy,t,a=1){x.save();x.globalAlpha=a;for(let i=0;i<14;i++){const ang=i*2.1,r=40+i*22;x.save();x.translate(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r*.35);x.rotate(ang+t*.2);const g=x.createLinearGradient(-30,0,30,0);g.addColorStop(0,'#cfd8dc');g.addColorStop(.5,'#ffffff');g.addColorStop(1,'#90a4ae');x.fillStyle=g;x.beginPath();x.moveTo(-30,-8);x.lineTo(28,-14);x.lineTo(22,12);x.lineTo(-24,8);x.fill();x.restore()}const gl=x.createRadialGradient(cx,cy,0,cx,cy,260);gl.addColorStop(0,`rgba(200,240,255,${.35+.2*Math.sin(t*4)})`);gl.addColorStop(1,'rgba(200,240,255,0)');x.fillStyle=gl;x.fillRect(cx-260,cy-260,520,520);x.restore()}
function balloon(cx,cy,s,t){x.save();x.translate(cx,cy+Math.sin(t*1.5)*20);x.scale(s,s);const g=x.createRadialGradient(-30,-40,10,0,0,140);g.addColorStop(0,'#fff');g.addColorStop(1,'#b0bec5');x.fillStyle=g;x.beginPath();x.ellipse(0,0,120,140,0,0,7);x.fill();x.strokeStyle='#eceff1';x.lineWidth=3;x.beginPath();x.moveTo(0,140);for(let k=0;k<12;k++)x.lineTo(Math.sin(k+t*3)*14,140+k*40);x.stroke();for(let k=0;k<3;k++){x.fillStyle='#90a4ae';x.fillRect(-20,240+k*130,40,30)}x.restore()}
function paper(cx,cy,s,lines,a=1,rot=-.05){x.save();x.globalAlpha=a;x.translate(cx,cy);x.rotate(rot);x.scale(s,s);x.fillStyle='#f4ecd8';x.fillRect(-300,-200,600,400);x.strokeStyle='#c8b98f';x.lineWidth=4;x.strokeRect(-300,-200,600,400);x.fillStyle='#222';x.textAlign='center';lines.forEach(([tx,sz],i)=>{x.font=`800 ${sz}px BD`;x.fillText(tx,0,-110+i*(sz+26))});x.restore()}
