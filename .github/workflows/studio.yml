name: Story Studio Worker
on:
  workflow_dispatch:
    inputs:
      stay: { description: 'minutes to stay on duty', default: '300' }
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: studio-worker
  cancel-in-progress: false
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Any queued job?
        id: q
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=studio-worker" | jq -r .value)
          N=$(curl -sS -X POST https://ceoehwleopykotddcxxk.supabase.co/functions/v1/studio -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d '{"action":"w_peek"}' | jq -r '.queued // 0')
          echo "queued=$N"; echo "n=$N" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji mesa-vulkan-drivers libvulkan1 libgomp1 unzip >/dev/null
          pip install -q opencv-python-headless numpy pillow
          npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p esr && cd esr && curl -sSL -o r.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip && unzip -oq r.zip && chmod +x realesrgan-ncnn-vulkan || true
      - name: Render (stays on duty ~5h, picks new jobs within a minute)
        run: |
          export STAY_MIN=${{ inputs.stay || '300' }}
          export OIDC_S=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=studio-worker" | jq -r .value)
          export OIDC_V=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=setup-radar-shorts" | jq -r .value)
          export ESR=$PWD/esr/realesrgan-ncnn-vulkan
          node studio/worker.js sjob
      - name: Debug copy (release studio-debug)
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          [ -f sjob/out.mp4 ] || exit 0
          gh release view studio-debug >/dev/null 2>&1 || gh release create studio-debug -t studio-debug -n debug --prerelease
          cd sjob && cp out.mp4 dbg-out.mp4 && (python3 -c "
          import glob;from PIL import Image
          f=sorted(glob.glob('img/*.png'))[:9];ims=[Image.open(x).convert('RGB').resize((512,341)) for x in f]+([Image.open('sheet.jpg').convert('RGB').resize((512,341))] if __import__('os').path.exists('sheet.jpg') else [])
          c=Image.new('RGB',(1024,341*((len(ims)+1)//2)));[c.paste(im,((i%2)*512,(i//2)*341)) for i,im in enumerate(ims)];c.save('dbg-grid.jpg',quality=85)" || true)
          gh release upload studio-debug dbg-out.mp4 dbg-grid.jpg --clobber || true
