name: shot
on:
  workflow_dispatch:
    inputs:
      pages: { description: "space separated name=url" }
      tag: { default: "shots" }
      w: { default: "1000" }
      h: { default: "1600" }
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -s playwright@1.49.1 && npx playwright install --with-deps chromium >/dev/null
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out && cat > s.js <<'JS'
          const { chromium } = require('playwright');
          (async () => { const br = await chromium.launch(); const pg = await br.newPage({ viewport: { width: +process.env.W, height: +process.env.H }, deviceScaleFactor: 2, colorScheme: 'light' });
            for (const p of process.argv.slice(2)) { const [n, u] = [p.slice(0, p.indexOf('=')), p.slice(p.indexOf('=') + 1)];
              try { await pg.goto(u, { waitUntil: 'networkidle', timeout: 60000 }); await pg.waitForTimeout(2500); await pg.screenshot({ path: `out/${n}.png` }); await pg.screenshot({ path: `out/${n}-full.png`, fullPage: true }); console.log('ok', n); } catch (e) { console.log('ERR', n, e.message); } }
            await br.close(); })();
          JS
          W=${{ inputs.w }} H=${{ inputs.h }} node s.js ${{ inputs.pages }}
          cd out && zip -q ../${{ inputs.tag }}.zip * && cd .. && gh release upload studio-debug ${{ inputs.tag }}.zip --clobber
