name: Horror Short
on:
  workflow_dispatch:
    inputs:
      story: { description: 'story json in horror/', required: true, default: 'story-217.json' }
permissions:
  contents: write
  id-token: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Build
        run: |
          export OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=setup-radar-shorts" | jq -r .value)
          node horror/make.js horror/${{ github.event.inputs.story }} job
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=horror-$(basename ${{ github.event.inputs.story }} .json)
          gh release view shorts >/dev/null 2>&1 || gh release create shorts --title "Daily Shorts" --notes "Auto-generated shorts" --prerelease
          cp job/out.mp4 "$N.mp4"; cp job/thumb.jpg "$N.jpg"
          gh release upload shorts "$N.mp4" "$N.jpg" --clobber
