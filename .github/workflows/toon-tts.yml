name: Toon voices
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'who to regenerate (G,B,L1..) — empty = all'
        default: ''
permissions:
  contents: write
  id-token: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Voices
        env:
          ONLY: ${{ inputs.only }}
        run: node toon/tts.js tn
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view studio-debug >/dev/null 2>&1 || gh release create studio-debug -t studio-debug -n debug --prerelease
          gh release upload studio-debug tn/tn-*.mp3 --clobber
