name: Daily Shorts
on:
  workflow_dispatch:
    inputs:
      kind: { description: 'lesson | candle | news | setup', required: true, default: 'lesson' }
      day: { description: 'day 1-90 (blank = auto)', required: false, default: '' }
      voice: { description: 'blank = default (onyx); set only for test variants', required: false, default: '' }
      style: { description: 'bass | warm', required: false, default: 'bass' }
  schedule:
    - cron: '17 20 * * *'   # lesson -> 1:47 IST (posts 13:00) — night run, GitHub cron is often hours late in the morning
    - cron: '47 20 * * *'   # candle -> 2:17 IST (posts 19:00)
    - cron: '37 21 * * *'   # setup -> 3:07 IST (posts 12:00)
    - cron: '7 1 * * *'     # news   -> 6:37 IST (approve after it lands, ~7-8 AM)

permissions:
  contents: write
  id-token: write

concurrency:
  group: shorts-${{ github.event.inputs.kind || github.event.schedule }}-${{ github.event.inputs.voice }}-${{ github.event.inputs.day }}
  cancel-in-progress: false

env:
  START_DATE: '2026-11-13'

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Pick kind and day
        id: p
        run: |
          K="${{ github.event.inputs.kind }}"
          case "${{ github.event.schedule }}" in
            '7 1 * * *') K=news;; '37 21 * * *') K=setup;; '17 20 * * *') K=lesson;; '47 20 * * *') K=candle;;
          esac
          D="${{ github.event.inputs.day }}"
          if [ -z "$D" ]; then D=$(( ( $(date -u -d "$(TZ=Asia/Kolkata date +%F)" +%s) - $(date -u -d "$START_DATE" +%s) ) / 86400 + 1 )); fi
          if [ "$K" = setup ] && [ -z "${{ github.event.inputs.day }}" ]; then D=$(( ( $(date -u -d "$(TZ=Asia/Kolkata date +%F)" +%s) - $(date -u -d "2026-11-16" +%s) ) / 86400 + 1 )); fi
          [ "$D" -lt 1 ] && D=1
          echo "kind=$K" >> $GITHUB_OUTPUT; echo "day=$D" >> $GITHUB_OUTPUT
          echo "TAG=${{ github.event.inputs.voice && format('v-{0}-', github.event.inputs.voice) || '' }}$K-$( [ $K = news ] && TZ=Asia/Kolkata date +%F || printf '%02d' $D )" >> $GITHUB_ENV
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Build short
        run: |
          export OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=setup-radar-shorts" | jq -r .value)
          export VOICE='${{ github.event.inputs.voice }}' STYLE='${{ github.event.inputs.style }}'
          node shorts/make.js ${{ steps.p.outputs.kind }} ${{ steps.p.outputs.day }} job
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view shorts >/dev/null 2>&1 || gh release create shorts --title "Daily Shorts" --notes "Auto-generated shorts" --prerelease
          cp job/out.mp4 "$TAG.mp4"; cp job/thumb.jpg "$TAG.jpg"; cp job/meta.json "$TAG.json"; cp job/script.json "$TAG-script.json"
          gh release upload shorts "$TAG.mp4" "$TAG.jpg" "$TAG.json" "$TAG-script.json" --clobber
          echo "VIDEO: https://github.com/${{ github.repository }}/releases/download/shorts/$TAG.mp4"
