name: clip-probe
on:
  workflow_dispatch:
    inputs:
      url: { description: "channel streams / video url", default: "https://www.youtube.com/@Tomovids/streams" }
      tag: { description: "release asset prefix", default: "tomo-probe" }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          yt-dlp --ignore-no-formats-error --skip-download -j "https://www.youtube.com/watch?v=XRo2L3077NI" > meta.json 2>err.txt || true
          tail -3 err.txt
          python3 -c "
import json; d=json.load(open('meta.json'))
print('title',d.get('title'),'dur',d.get('duration'))
h=d.get('heatmap') or []; print('heatmap points',len(h))
top=sorted(h,key=lambda x:-x['value'])[:15]
for x in sorted(top,key=lambda x:x['start_time']): print(int(x['start_time']),int(x['end_time']),round(x['value'],3))
print('chapters',d.get('chapters'))
" || head -c 500 meta.json
