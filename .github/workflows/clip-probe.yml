name: clip-probe
on:
  workflow_dispatch:
    inputs:
      url: { description: "channel streams / video url", default: "https://www.youtube.com/@Tomovids/streams" }
      tag: { description: "release asset prefix", default: "tomo-probe" }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -x
          yt-dlp --version
          for C in android_vr mweb web_safari ios tv_simply; do
            echo "== client $C"; yt-dlp --extractor-args "youtube:player_client=$C" -F "https://www.youtube.com/watch?v=XRo2L3077NI" 2>&1 | tail -4
          done
          echo "== twitch"; yt-dlp --flat-playlist --playlist-items 1:5 --print "%(id)s|%(title)s|%(duration)s" "https://www.twitch.tv/tomovids/videos?filter=archives" 2>&1 | tail -6
          echo "== kick"; yt-dlp --flat-playlist --playlist-items 1:5 --print "%(id)s|%(title)s" "https://kick.com/tomovids/videos" 2>&1 | tail -4
