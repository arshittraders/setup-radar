name: clip-probe
on:
  workflow_dispatch:
    inputs:
      url: { description: "channel streams / video url", default: "https://www.youtube.com/@Tomovids/streams" }
      tag: { description: "release asset prefix", default: "tomo-probe" }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -x
          yt-dlp --version
          yt-dlp --flat-playlist --playlist-items 1:3 --print "%(id)s|%(title)s|%(duration)s" "${{ inputs.url }}" | tee list.txt || true
          ID=$(head -1 list.txt | cut -d'|' -f1)
          [ -z "$ID" ] && exit 1
          yt-dlp -F "https://www.youtube.com/watch?v=$ID" | tail -25 || true
          yt-dlp -f "bv*[height<=720]" --download-sections "*00:20:00-00:20:20" -o sec.%(ext)s "https://www.youtube.com/watch?v=$ID" || true
          ls -la
          f=$(ls sec.* | head -1)
          ffmpeg -v error -y -ss 5 -i "$f" -frames:v 1 frame1.jpg || true
          ffmpeg -v error -y -ss 15 -i "$f" -frames:v 1 frame2.jpg || true
          gh release view studio-debug >/dev/null 2>&1 || gh release create studio-debug -t studio-debug -n debug --prerelease
          gh release upload studio-debug frame1.jpg#${{ inputs.tag }}-1.jpg list.txt --clobber || true
          cp frame1.jpg ${{ inputs.tag }}-1.jpg; cp frame2.jpg ${{ inputs.tag }}-2.jpg; cp list.txt ${{ inputs.tag }}-list.txt
          gh release upload studio-debug ${{ inputs.tag }}-1.jpg ${{ inputs.tag }}-2.jpg ${{ inputs.tag }}-list.txt --clobber
