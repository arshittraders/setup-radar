name: clip-probe
on:
  workflow_dispatch:
    inputs:
      url: { description: "channel streams / video url", default: "https://www.youtube.com/@Tomovids/streams" }
      tag: { description: "release asset prefix", default: "tomo-probe" }
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]"
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          yt-dlp --flat-playlist --playlist-items 1:8 --print "%(id)s|%(title)s|%(duration)s|%(upload_date)s" "https://www.twitch.tv/kreekcraft/videos?filter=archives" 2>&1 | tail -10
          ID=$(yt-dlp --flat-playlist --playlist-items 1 --print "%(id)s" "https://www.twitch.tv/kreekcraft/videos?filter=archives" 2>/dev/null | head -1)
          echo "ID=$ID"; yt-dlp -F "https://www.twitch.tv/videos/${ID#v}" 2>&1 | tail -8
