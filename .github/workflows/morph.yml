name: morph
on:
  workflow_dispatch:
    inputs:
      seed: { description: "look seed (bg/metal/object)", default: "1" }
      tag: { description: "release asset name", required: true }
      samples: { description: "cycles samples", default: "24" }
permissions:
  contents: write
jobs:
  seg:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        idx: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q bpy==5.3.0
      - name: render segment
        run: |
          F=(4 16 64 256 1024 4096 16384 65536)
          I=${{ matrix.idx }}; N=${F[$I]}; LAST=$(( I == 7 ? 120 : 75 ))
          mkdir -p out
          python morph/morph.py -- --faces $N --stack $(( 7 - I )) --seed ${{ inputs.seed }} --samples ${{ inputs.samples }} --f1 $LAST --out out/s 2>&1 | grep -vE "Fra:|Sample" | tail -20
          ffmpeg -v error -y -framerate 30 -i out/s_%04d.jpg -c:v libx264 -crf 16 -pix_fmt yuv420p seg$I.mp4
      - uses: actions/upload-artifact@v4
        with: { name: "seg${{ matrix.idx }}", path: "seg${{ matrix.idx }}.mp4" }
  final:
    needs: seg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: segs, merge-multiple: true }
      - run: pip install -q numpy
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          L=("4 FACE" "16 FACE" "64 FACE" "256 FACE" "1024 FACE" "4096 FACE" "16K FACE" "65K FACE")
          F=(4 16 64 256 1024 4096 16384 65536)
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          echo "[" > segs.json; st=0; : > list.txt
          for i in 0 1 2 3 4 5 6 7; do
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 segs/seg$i.mp4)
            ffmpeg -v error -y -i segs/seg$i.mp4 -vf "scale=1080:1920:flags=lanczos,drawtext=fontfile=$FONT:text='${L[$i]}':x=70:y=110:fontsize=78:fontcolor=white:shadowcolor=black@0.45:shadowx=3:shadowy=3" -c:v libx264 -crf 17 -pix_fmt yuv420p -r 30 l$i.mp4
            echo "file 'l$i.mp4'" >> list.txt
            [ $i -gt 0 ] && echo "," >> segs.json
            echo "{\"start\":$st,\"dur\":$d,\"faces\":${F[$i]}}" >> segs.json
            st=$(python -c "print($st+$d)")
          done
          echo "]" >> segs.json
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy v.mp4
          python morph/audio.py segs.json a.wav
          ffmpeg -v error -y -i v.mp4 -i a.wav -c:v copy -c:a aac -b:a 160k -shortest ${{ inputs.tag }}.mp4
          ls -la ${{ inputs.tag }}.mp4
          gh release view studio-debug >/dev/null 2>&1 || gh release create studio-debug -t studio-debug -n debug --prerelease
          gh release upload studio-debug ${{ inputs.tag }}.mp4 --clobber
