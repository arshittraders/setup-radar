name: crystal-final
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "crystal run id whose frames to assemble", required: true }
      tag: { description: "release asset name", required: true }
permissions:
  contents: write
  actions: read
jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: fr, merge-multiple: true, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q numpy
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls fr | wc -l
          ffmpeg -v error -y -framerate 30 -start_number 1 -i fr/c_%04d.jpg -vf "scale=1080:1920:flags=lanczos" -c:v libx264 -crf 17 -pix_fmt yuv420p v.mp4
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 v.mp4)
          python morph/audio_crystal.py $D a.wav
          ffmpeg -v error -y -i v.mp4 -i a.wav -c:v copy -c:a aac -b:a 160k -shortest ${{ inputs.tag }}.mp4
          gh release view studio-debug >/dev/null 2>&1 || gh release create studio-debug -t studio-debug -n debug --prerelease
          gh release upload studio-debug ${{ inputs.tag }}.mp4 --clobber
