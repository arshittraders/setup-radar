name: toon-f5-sample
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          python -m venv $HOME/vf
          $HOME/vf/bin/pip install -q "torch==2.7.1" "torchaudio==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          $HOME/vf/bin/pip install -q git+https://github.com/ai4bharat/IndicF5.git soundfile
          $HOME/vf/bin/pip install -q -U numpy pyarrow "transformers==4.49.0" "datasets==3.3.2" "huggingface_hub<0.30"
          $HOME/vf/bin/pip install -q "torch==2.7.1" "torchaudio==2.7.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Voices (IndicF5 clone)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          F5_PY: /home/runner/vf/bin/python
        run: node toon/f5.js toon/f5sample
      - name: Render
        run: node toon/render.js toon/f5sample toon/fonts
      - name: Upload
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          ls toon/f5sample | head -50
          f=$(ls toon/f5sample/*.mp4 2>/dev/null | head -1); [ -n "$f" ] && cp "$f" gb-padhai-bhoot.mp4 && gh release upload studio-debug gb-padhai-bhoot.mp4 --clobber
          cd toon/f5sample && zip -q ../../f5wav.zip tn-*.mp3 2>/dev/null; cd ../..; [ -f f5wav.zip ] && gh release upload studio-debug f5wav.zip --clobber || true
