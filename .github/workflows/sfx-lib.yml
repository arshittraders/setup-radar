name: sfx-lib
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 sfx/build_lib.py
      - run: |
          git config user.name "studio-bot"; git config user.email "bot@kiwtech.in"
          git add sfx && git commit -qm "sfx: CC0 sound library from Openverse" && git pull -q --rebase && git push -q
          du -sh sfx
